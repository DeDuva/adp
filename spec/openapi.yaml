    parameters:
      - $ref: "#/components/parameters/id"
    get:
      x-required-scope: "runner"
      summary: >
        M4-9c: a tarball (`git archive --format=tar`) of the job's own
        repo/sha — "materializes a checkout" (the gate-runner
        design) for the isolated executor to `docker cp` into a container,
        never a host mount and never routed through the container's own
        (network-denied) network. Requires the `runner` scope. Bounded to
