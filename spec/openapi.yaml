  /api/adp/repos/{owner}/{repo}/sessions/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    get:
      x-required-scope: "repo:read"
      summary: >
        #152: verification at the resolution the record is written at. The
        run-level endpoint answers "is this run's evidence intact", which is the
        question a reviewer asks; this one answers it for one session, and it
        covers two cases that one cannot. A session need not belong to a run — a
        developer checkpointing their own work is a session — and a session long
        enough to be worth bounding is one worth verifying in pieces.

        Three coverages, and the response names which one it ran. Default
        `full`, from the genesis, pinned to every signed checkpoint head it
        passes. `from=checkpoint` starts at the newest checkpoint whose
        signature verifies. `from_seq`/`to_seq` walk an explicit window, where
        `from_seq` is exclusive and `to_seq` inclusive, matching `seq`'s own
        1-based numbering — `from_seq=100&to_seq=200` is the hundred events
        after the hundredth.

        `from=checkpoint` and an explicit window are alternatives, not a
        combination. An anchor already fixes where the window starts, and
        letting a caller move it off a signed head is how you build a verifier
        that starts too late and misses the tampering it exists to find.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            enum: [checkpoint]
        - name: from_seq
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: to_seq
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >
            The session's chain and its emitter's numbering as two separate
            answers, plus `prefix` and `verified_from_seq`/`verified_to_seq`
            stating exactly what was recomputed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionVerifyResult"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: >
            `from=checkpoint` combined with an explicit window, or a `to_seq`
            that is not greater than `from_seq`.
  /api/adp/repos/{owner}/{repo}/sessions/{id}/events:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    post:
      x-required-scope: "repo:write"
      summary: >
        Append to a session's trajectory — every message, model call, tool
        execution, handoff, commit, and test result. Events are hash-chained
        rather than individually signed: the chain head is what checkpoint and
        run attestations commit to, so recording stays cheap enough to always
        happen while tampering anywhere in the sequence stays detectable.
        Batched, and idempotent under retry when `client_event_id` is supplied.

        #146: two byte ceilings apply, so a producer can respect them rather
        than discover them. **131072 bytes (128 KiB) per event `payload`** and
        **1048576 bytes (1 MiB) summed across a batch** — measured on the JSON
        as it will be stored, not on the request body. Either breach is a 422
        naming the offending event by index and by its `client_event_id`, and
        the batch is refused *as a batch*: nothing is chained, because a
        partially-appended batch is what this endpoint's all-or-nothing rule
        exists to prevent.

        Oversized events are **refused, never truncated and never silently
        digested**. A truncated payload that is still hash-chained is worse
        than a rejected one — it is a durable record that looks complete — and
        only the producer can decide what to emit instead, which it cannot do
        if it is not told.

        #148: **payloads are scanned for secrets before anything is chained.**
        Push protection guards the diff; a trajectory records what the agent
        *read*, so a `.env` it opened and correctly declined to commit reaches
        no diff and would land here verbatim. A detected secret has its span
        replaced by a visible `[redacted:<pattern>]` marker, and the event
        carries a `redactions` array of `{ path, pattern }` naming where. The
        chain commits to the redacted form, so what verifies is what is
        stored. Per repository, `trajectory.on_secret` in `adp.yaml` chooses
        `redact` (the default) or `refuse`; under `refuse` the whole batch is
        rejected with `code: secret_detected` and nothing is chained.

        #199: **payloads are stored as their structure by default.** A detector
        removes what it recognises; the larger surface is everything else, and
        ambient capture makes every connected session a producer of it. Under
        `trajectory.payloads: structure` — the default — the stored payload
        keeps its objects, arrays, keys, numbers and booleans, and each string
        becomes `[adp:str bytes=N]`; the event carries `payload_digest`, sha256
        of the canonical JSON of the payload as supplied, so a producer holding
        its own copy can still prove the record corresponds to it. A repo sets
        `payloads: full` to store payloads as supplied, and its events carry no
        `payload_digest`. The projection is applied *after* redaction and
        before anything is chained, so the digest names what `full` would have
        stored rather than the secret, and the ceilings above are re-checked on
        the projected form — no stored event exceeds them either way.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [kind]
                    properties:
                      kind:
                        type: string
                        enum:
                          [message, model_call, tool_call, handoff, commit, test_result, custom]
                      type:
                        type: string
                        description: The harness's own name within that kind. Never branched on.
                      payload:
                        description: >
                          Opaque to ADP — never parsed, never validated beyond
                          "it is JSON". Bounded at 131072 bytes once serialized
                          (#146); measuring a size is not reading a value, so
                          the opaqueness holds.
                      status:
                        type: string
                        enum: [success, failure, error, rejected, skipped]
                      model:
                        type: string
                      tokens_in:
                        type: integer
                      tokens_out:
                        type: integer
                      cost_micro_usd:
                        type: integer
                      duration_ms:
                        type: integer
                      git_sha:
                        type: string
                        description: Set on commit events; joins the trajectory to the change record.
                      related_session_id:
                        type: string
                        format: uuid
                        description: >
                          Set on handoff events. This event on session A naming
                          session B is the edge A→B.
                      client_event_id:
                        type: string
                        description: The emitter's own id; a repeat is dropped rather than appended twice.
                      producer_seq:
                        type: integer
                        minimum: 1
                        description: >
                          The emitter's own contiguous counter for this session,
                          starting at 1. `client_event_id` makes a retry
                          harmless but cannot prove nothing was dropped — an
                          event that never arrived has no id to deduplicate.
                          This can: a batch that skips a number is rejected
                          whole with 409 and `expected_next_seq`. Set it on
                          every event of a batch or on none; an emitter that
                          does not count is untracked, not incomplete.
                      occurred_at:
                        type: string
                        format: date-time
                producer_id:
                  type: string
                  description: >
                    Who is counting — recorded on the events of this batch that
                    carry a producer_seq. Batch-level rather than per-event
                    because a chain has exactly one writer.
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: >
            Appended, with the new chain head, any duplicates that were skipped,
            and `accepted_through` — the highest producer_seq durably stored for
            this session, which is the mark an emitter trims its spool against
            (null when the session is untracked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAppendResult"
        "409":
          description: >
            The session is closed, or the batch skips the emitter's numbering.
            In the latter case the body carries `expected_next_seq`, the
            producer_seq the session is waiting for, so a spool knows where to
            replay from rather than guessing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  expected_next_seq:
                    type: integer
                    description: >
                      The producer_seq this session is waiting for. Present only
                      on a contiguity rejection, which is the case a spool needs
                      it for; absent when the session is simply closed.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: >
            Validation failed, related_session_id is not in this repository, or
            producer_seq was set on some events of the batch but not all.
    get:
      x-required-scope: "repo:read"
      summary: A session's trajectory in sequence order, with each event's chain hashes.
      security:
        - bearerAuth: []
      parameters:
        - name: kinds
          in: query
          schema:
            type: string
          description: Comma-separated event kinds.
        - name: since
          in: query
          schema:
            type: integer
          description: Return events after this seq.
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTrajectory"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
  /api/adp/repos/{owner}/{repo}/runs:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      x-required-scope: "repo:write"
      summary: >
        Open a run — an orchestrator's unit of assigned work, spanning the
        sessions it spawns to do it. `orchestrator` is opaque in the way
        `harness` is. When `external_ref` names a run that already exists, the
        existing run is returned with 200 instead of a second run being created,
        so an orchestrator restarting after a crash rejoins rather than forking
        the trajectory in two.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent_id, orchestrator]
              properties:
                intent_id:
                  type: string
                  format: uuid
                  description: >
                    The intent this run works towards. **Nothing under `/api/adp`
                    mints one**: intents are created as a side effect of filing an
                    issue on the compatibility plane, and
                    `POST /api/v3/repos/{owner}/{repo}/issues` returns the
                    `intent_id` it created. Repositories are likewise created via
                    `POST /api/v3/user/repos`. A client generated from the native
                    plane alone therefore cannot open a run — see "Plane
                    dependencies" in docs/api-compatibility.md.
                orchestrator:
                  type: string
                external_ref:
                  type: string
                  description: The orchestrator's own id for the assignment.
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: >
                    What this run was — vendor, model, tier. Set at open and
                    immutable: they are covered by the run attestation, so a
                    label that could be edited afterwards would leave the
                    envelope and the row disagreeing. There is no update route.
                    Ranking consumers read these rather than parsing
                    `external_ref`, whose format nothing enforces.
                parent_run:
                  type: string
                  format: uuid
                  description: >
                    #240: the run this one follows. Open-time only, for the same
                    reason `labels` are — lineage is a fact about why this run
                    exists, and a run that could be re-parented later is one
                    whose history is editable. Must name a run in this
                    repository, and must be given together with `relationship`:
                    a parent with no relationship is a lineage nobody can
                    interpret.
                relationship:
                  type: string
                  enum: [retry, continue, reimplement, supersede]
                  description: >
                    How this run relates to its parent. Four, and they are not
                    orderings of one thing. `retry` is the same work again after
                    something that was not the work went wrong. `continue` is
                    the run-level statement of what a resumed session already
                    records. `reimplement` starts over from the base without
                    looking at what the parent produced — an independent second
                    attempt, which is evidence in a way a continuation is not.
                    `supersede` is a claim about outcomes rather than method.
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Rejoined an open run with this external_ref
        "201":
          description: Created
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: A run with this external_ref is already closed or abandoned
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Intent not found in this repository
    get:
      x-required-scope: "repo:read"
      summary: Runs in this repository, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: intent_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, abandoned]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
  /api/adp/repos/{owner}/{repo}/runs/compare:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      x-required-scope: "repo:read"
      summary: >
        N runs against one intent, each pairing its attested eval outcome with
        what the trajectory cost to produce it — the table eval-based
        optimization is read off. Ranked by score descending; unscored runs sort
        last, because unmeasured is not the same as scoring zero.
      security:
        - bearerAuth: []
      parameters:
        - name: intent_id
          in: query
          schema:
            type: string
            format: uuid
        - name: eval
          in: query
          schema:
            type: string
          description: Restrict the paired eval to this name.
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, abandoned]
          description: >
            #156: restrict to runs in this state. Applied before `limit`, so the
            answer is "the most recent N runs in this state" rather than "the
            runs in this state among the most recent N" — which reads
            identically and is a different question. An unrecognised value is
            ignored rather than refused: this is a display filter, and a typo
            that quietly returns everything is a better failure than a 422 in
            the middle of narrowing a table.
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: >
            One row per run, carrying its `labels`, the single latest `eval`,
            and `evals` — the latest result per eval *name*. A run scored on
            several axes has several results, and a consumer ranking per axis
            reads `evals`; `eval` alone would show whichever score was recorded
            last.
          content:
            application/json:
              schema:
                type: object
                required: [intent_id, runs]
                properties:
                  intent_id: { type: string, format: uuid, nullable: true }
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunComparison"
  /api/adp/repos/{owner}/{repo}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    get:
      x-required-scope: "repo:read"
      summary: A run with its sessions, their chain heads, and its evals.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Run
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
  /api/adp/repos/{owner}/{repo}/runs/{runId}/close:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    post:
      x-required-scope: "repo:write"
      summary: >
        Close a run against the commit it produced, signing a DSSE attestation
        that binds that sha to every session's trajectory chain head. Any
        still-open session is closed here: the attestation names each chain
        head, so a session that could still append afterwards would leave an
        attestation that no longer describes the trajectory. Idempotent on the
        same sha; 409 on a different one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [final_git_sha]
              properties:
                final_git_sha:
                  type: string
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Closed, with the signed attestation
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Already closed against a different sha, or abandoned
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The commit could not be resolved in this repository
  /api/adp/repos/{owner}/{repo}/runs/{runId}/abandon:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    post:
      x-required-scope: "repo:write"
      summary: >
        Abandon a run that produced no commit. The trajectory is kept — the
        discarded attempts staying queryable is the point — and the run's
        sessions are closed.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Abandoned
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Cannot abandon a closed run
  /api/adp/repos/{owner}/{repo}/runs/{runId}/trajectory:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    get:
      x-required-scope: "repo:read"
      summary: >
        The run's whole trajectory, merged across its sessions in the order
        things actually happened.
      security:
        - bearerAuth: []
      parameters:
        - name: kinds
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Events
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
  /api/adp/repos/{owner}/{repo}/runs/{runId}/stats:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    get:
      x-required-scope: "repo:read"
      summary: >
        What the run cost and what it spent it on: counts and tokens by event
        kind, per-tool call and failure counts, per-model spend, the handoff
        graph, and the commits the run produced.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Stats
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
  /api/adp/repos/{owner}/{repo}/runs/{runId}/verify:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    get:
      x-required-scope: "repo:read"
      summary: >
        Recompute every session's hash chain from the stored rows and check the
        run attestation against them. Tamper-evidence nobody can check is
        decoration; this is what makes the guarantee falsifiable by any holder
        of a read token. Reports where a chain first broke, by seq.

        #152: chains are read in batches and sessions are verified with a
        bounded fan-out, so the cost of this endpoint is a constant rather than
        the size of the run. `from=checkpoint` additionally starts each chain at
        the newest checkpoint whose signature verifies, which bounds the work by
        what has happened since that checkpoint rather than by the age of the
        session. It is opt-in, and `full` is not merely the slower default but
        the *stronger* check: it recomputes every event and pins the result to
        every signed checkpoint head it passes, so it catches both a careless
        edit and a rewrite that repaired its own hashes. `from=checkpoint`
        catches the first, and only after the anchor. What each session's result
        covers is stated per session as `prefix` — see `RunVerifySession`.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            enum: [checkpoint]
          description: >
            Anchor each session at its newest signature-verified checkpoint
            instead of recomputing from the genesis. Sessions with no usable
            checkpoint fall back to a full recomputation — the fallback is
            always toward the stronger check, never away from it.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: >
            Verification result. `chains_ok` says the events ADP holds were not
            edited; `emitters_ok` says ADP was given all of them, per session as
            `emitter_tracked`/`emitter_complete`/`emitter_first_gap` — two
            different guarantees, since a chain can verify perfectly and still be
            missing an event that never arrived. Top-level `ok` is false if
            either fails, or if the attestation does not check out. `evals`
            carries each score's `reporter_principal` and
            `separately_authorized`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunVerifyResult"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
  /api/adp/repos/{owner}/{repo}/runs/{runId}/evals:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    post:
      x-required-scope: "repo:write"
      summary: >
        Attach a deterministic eval result to a run, as gate evidence. The eval
        *is* a gate result — same signing, same table, same land policy and `gh
        pr checks` projection — and the signed predicate binds the score to the
        run, the commit, the trajectory digest, and the digest of the eval
        definition that produced it. Report under `gate_name: score` to feed a
        candidate set's `best_score` selection.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, passed]
              properties:
                name:
                  type: string
                passed:
                  type: boolean
                score:
                  type: number
                summary:
                  type: string
                spec:
                  description: The eval definition; digested to make the result identifiable.
                spec_digest:
                  type: string
                  description: Supply directly if the eval harness already content-addresses its suites.
                gate_name:
                  type: string
                  description: Defaults to `eval:<name>`.
                git_sha:
                  type: string
                  description: Defaults to the run's final_git_sha.
                metrics:
                  type: object
                  additionalProperties: true
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: >
            Recorded, with the gate result it was reported as, plus
            `reporter_principal` and `separately_authorized` — the latter true
            when the identity reporting the score is not the one that opened the
            run, i.e. the score is not a self-report.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Run not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The run has no final_git_sha and no git_sha was supplied
    get:
      x-required-scope: "repo:read"
      summary: >
        The evals recorded against this run, newest first, each carrying
        `reporter_principal` and `separately_authorized`.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Evals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvalResult"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
components:
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
    repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
    number:
      name: number
      in: path
      required: true
      schema:
        type: integer
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sha:
      name: sha
      in: path
      required: true
      schema:
        type: string
    path:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: Matches the rest of the URL, including slashes.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    # ── Native-plane response shapes ────────────────────────────────────────
    #
    # Responses were prose-only until 2026-08-08. The first external consumer
    # generated a client from this document and got two of five fields of the
    # append result wrong — `head` was described as "the chain head" and read as
    # `chain_head`, and `duplicates` reads as a count in prose while it is a list
    # of client_event_ids. Requests were typed and responses were not, so a
    # generated client could only ever type half the contract, and the untyped
    # half is where a consumer's bugs live. See issue #64.
    TrajectoryEvent:
      type: object
      description: One event in a session's hash-chained trajectory.
      required: [id, session_id, seq, kind, type, payload, occurred_at, hash, prev_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        seq:
          type: integer
          description: ADP's own position in this session's chain, assigned server-side.
        kind:
          type: string
          enum: [message, model_call, tool_call, handoff, commit, test_result, custom]
        type:
          type: string
          description: The harness's own name within that kind. Free-form; never branched on.
        payload:
          type: object
          description: >
            Opaque to ADP, and never parsed by it. Defaults to `{}` when the
            event carried none — the endpoint declares only `kind` as required.

            Read it together with `payload_digest`: under the default
            `trajectory.payloads: structure` this is the *shape* of what the
            producer sent, with each string replaced by `[adp:str bytes=N]`.
          additionalProperties: true
        payload_digest:
          type: string
          nullable: true
          description: >
            #199. Null means `payload` above is exactly what the producer sent.
            Non-null means it is that payload's structure with the string
            content removed, and this is sha256 (hex) of the canonical JSON of
            what was sent — the commitment that makes "verified, payload not
            retained" a verification state rather than a hole. Covered by
            `hash`, like every other field here.
        redactions:
          type: array
          nullable: true
          description: >
            #148. Null on the ordinary event nothing fired on. Where the secret
            detector did fire, one entry per replaced span, so a reader sees
            that an event was redacted without having to spot the
            `[redacted:<pattern>]` marker in the text — and, under
            `payloads: structure`, without any text left to spot it in.
          items:
            type: object
            required: [path, pattern]
            properties:
              path:
                type: string
                description: A JSON path into the payload, e.g. `$.messages[2].text`.
              pattern:
                type: string
        status:
          type: string
          nullable: true
          enum: [success, failure, error, rejected, skipped]
        model: { type: string, nullable: true }
        tokens_in: { type: integer, nullable: true }
        tokens_out: { type: integer, nullable: true }
        cost_micro_usd: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        git_sha: { type: string, nullable: true }
        related_session_id: { type: string, format: uuid, nullable: true }
        client_event_id:
          type: string
          nullable: true
          description: The emitter's own id, which makes a retried batch idempotent.
        producer_seq: { type: integer, nullable: true }
        producer_id: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
        hash:
          type: string
          description: This event's chain hash, covering every field above and the previous hash.
        prev_hash: { type: string }
        created_at: { type: string, format: date-time }
    EventAppendResult:
      type: object
      required: [session_id, appended, duplicates, count, head, accepted_through, events]
      properties:
        session_id: { type: string, format: uuid }
        appended:
          type: integer
          description: How many events this call actually stored. A **count**.
        duplicates:
          type: array
          description: >
            **A list of `client_event_id`s, not a count** — the ids that were
            already present and therefore skipped. Reported rather than silently
            absorbed: an emitter re-sending a landed batch has a bug, and silence
            would let it stay one. Note that `if duplicates:` behaves the same
            whether this is a list or a count, so a client that assumed a count
            breaks only when a duplicate actually occurs — during a retry, which
            is exactly when the recorder is already in trouble.
          items: { type: string }
        count:
          type: integer
          description: The session's total event count after this append.
        head:
          type: string
          description: >
            The new chain head. **Named `head`, not `chain_head`** — this is the
            value a checkpoint or run attestation commits to.
        accepted_through:
          type: integer
          nullable: true
          description: >
            The highest producer_seq durably stored for this session, and the
            mark an emitter trims its spool against. Null when the session is
            untracked — an emitter that does not count is untracked, not
            incomplete.
        events:
          type: array
          items: { $ref: "#/components/schemas/TrajectoryEvent" }
    SessionTrajectory:
      type: object
      required: [session_id, events]
      properties:
        session_id: { type: string, format: uuid }
        events:
          type: array
          items: { $ref: "#/components/schemas/TrajectoryEvent" }
    ExportBundle:
      type: object
      required: [format, exported_at, instance, repository]
      properties:
        format:
          type: string
          description: "`adp.repository.export/v1`. A bundle in an unknown shape is refused rather than parsed hopefully."
        exported_at:
          type: string
          format: date-time
        instance:
          type: object
          required: [public_url, signing_public_key]
          description: >
            Who attested everything below. The receiving instance archives this
            key and verifies against it — without it, every signature in the
            bundle is unverifiable there.
          properties:
            public_url:
              type: string
            signing_public_key:
              type: string
        repository:
          type: object
          required: [owner, name, default_branch]
          properties:
            owner: { type: string }
            name: { type: string }
            default_branch: { type: string }
        identities:
          type: array
          items: { type: object }
          description: >
            The principals the record names — id, kind and principal only. Not a
            nicety: `operations.actor_id` and the author fields are hard foreign
            keys, so a bundle without these cannot be inserted. Rewriting every
            actor to whoever ran the import would make the log say one person
            did everything, which is a falsified record rather than a migrated
            one. No tokens, no identity links, no memberships: what moves is who
            the record names, not the ability to act as them.
        intents:
          type: array
          items: { type: object }
        issues:
          type: array
          items: { type: object }
        proposals:
          type: array
          items: { type: object }
        changes:
          type: array
          items: { type: object }
        gate_results:
          type: array
          items: { type: object }
        runs:
          type: array
          items: { type: object }
        operations:
          type: array
          items: { type: object }
    ImportResult:
      type: object
      required: [repo_id, imported, key_archived]
      properties:
        repo_id:
          type: string
          format: uuid
        imported:
          type: object
          additionalProperties:
            type: integer
          description: Rows written per table. Zero everywhere on a re-import, which is a no-op rather than a duplicate history.
        key_archived:
          type: boolean
          description: Whether the exporting instance's key was new to this one.
        note:
          type: string
    Intent:
      type: object
      required: [id, title, body, source, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        source:
          type: string
          enum: [issue, task, api]
        issue_number:
          type: integer
          nullable: true
          description: The issue carrying this intent, where one does.
        upstream_host:
          type: string
          nullable: true
          description: "#226: which host the issue this came from lives on. Null on a natively filed intent."
        upstream_number:
          type: integer
          nullable: true
        upstream_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Owner:
      type: object
      required: [login, id, node_id, type]
      properties:
        login:
          type: string
        id:
          type: string
          format: uuid
        node_id:
          type: string
          description: base64("Organization:<uuid>") — the id the GraphQL createRepository mutation takes as `ownerId`.
        type:
          type: string
          enum: [Organization]
        name:
          type: string
        html_url:
          type: string
        created_at:
          type: string
          format: date-time
    GitHubApp:
      type: object
      required: [app_id, slug, name, html_url, client_id, created_at]
      properties:
        app_id:
          type: string
          description: GitHub's numeric app id, as a string — it is the JWT `iss` claim, not a number anything counts with.
        slug:
          type: string
        name:
          type: string
        html_url:
          type: string
        client_id:
          type: string
        created_at:
          type: string
          format: date-time
    GitHubAppCreated:
      type: object
      required: [app_id, slug, name, html_url, install_url]
      properties:
        app_id:
          type: string
        slug:
          type: string
        name:
          type: string
        html_url:
          type: string
        install_url:
          type: string
          description: >
            Where the installer goes next. Named rather than redirected to: a
            redirect out of an API response is a surprise for the agent calling
            it and a convenience only for a browser.
    OrgSummary:
      type: object
      required: [id, name, kill_switch]
      description: >
        #97, the org identifier contract: an organization has exactly two
        identifiers, permanently mapped. `id` (uuid) is what every
        `/api/adp/orgs/{orgId}` route takes. `name` is the org's immutable
        URL slug — the `{owner}` path segment of every repo it holds, on
        both planes. They are the same org seen from the native and compat
        planes respectively; `GET /api/adp/orgs` is the translation (it
        returns both). gh fidelity requires owner-shaped URLs, so the slug
        cannot change: org rename is unsupported pre-1.0, by design rather
        than omission.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kill_switch: { type: boolean }
    OrgQuota:
      type: object
      required: [limit, used]
      description: >
        `limit: null` means unlimited — the "absence is not a limit"
        convention the org quota columns already use (M4-3, M4-9d). `used` is
        counted by the same query the enforcement path runs, so the console
        and the thing doing the refusing cannot disagree.
      properties:
        limit: { type: integer, nullable: true }
        used: { type: integer }
    OrgStorageQuota:
      type: object
      required: [limit, used, measured_at]
      description: >
        M4-3's byte ceiling. Same `limit: null` convention as OrgQuota, but
        `used` is a measurement rather than a count, which changes two things
        a client has to handle. It is nullable: null means the org has never
        been metered, which is not the same as zero and is why enforcement
        treats an unmeasured org as under quota rather than refusing its
        writes. And it is stale by up to one meter interval, which is what
        `measured_at` is for — an org can exceed `limit` by whatever it wrote
        since that timestamp, and a client showing `used` without it is
        showing a number whose age it does not know.
      properties:
        limit: { type: integer, nullable: true }
        used: { type: integer, nullable: true }
        measured_at: { type: string, format: date-time, nullable: true }
    OrgDetail:
      type: object
      required: [id, name, kill_switch, policy_repo, org_floor, instance_floor, quotas]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kill_switch: { type: boolean }
        policy_repo:
          type: object
          nullable: true
          description: The repo whose `policy.yaml` carries this org's floor. Null until one is designated.
          required: [owner, name, default_branch]
          properties:
            owner: { type: string }
            name: { type: string }
            default_branch: { type: string }
        org_floor:
          type: object
          required: [require, source]
          properties:
            require:
              type: array
              items: { type: string, enum: [gates_green, one_approval] }
            source:
              type: string
              enum: [no_policy_repo, no_policy_file, ok, malformed]
              description: >
                Where the floor came from. `malformed` is the one that matters:
                a policy.yaml that does not parse is failed closed to every
                known requirement, which is the right enforcement decision and
                indistinguishable from a deliberate one without this field.
        instance_floor:
          type: array
          items: { type: string, enum: [gates_green, one_approval] }
        quotas:
          type: object
          required: [max_repos, max_concurrent_workspaces, max_concurrent_gate_jobs, max_storage_bytes]
          properties:
            max_repos: { $ref: "#/components/schemas/OrgQuota" }
            max_concurrent_workspaces: { $ref: "#/components/schemas/OrgQuota" }
            max_concurrent_gate_jobs: { $ref: "#/components/schemas/OrgQuota" }
            max_storage_bytes: { $ref: "#/components/schemas/OrgStorageQuota" }
        retention:
          type: object
          description: >
            #161: the interim trajectory retention window, stated where an
            operator reads before it matters rather than after. Reducing a
            payload keeps the event — its place in the chain, its hash and every
            typed column survive, and a reduced run still verifies — so what is
            lost is what the agent said, and `not_retained` on a verification
            result says how much of a range could only be taken as recorded.
          required: [days, source, reduced, dueNext]
          properties:
            days:
              type: integer
              description: Days payloads are kept. 0 means indefinitely.
            source:
              type: string
              enum: [org, instance]
              description: Whether this org set the window or inherited it.
            reduced:
              type: integer
              description: Events in this org whose payload has already been reduced.
            dueNext:
              type: integer
              description: >
                Events the next sweep will reduce. This is the number that makes
                the block a warning rather than a report.
    OrgRepoPolicy:
      type: object
      required: [id, owner, name, default_branch, is_policy_repo, repo_requirements, resolved]
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        name: { type: string }
        default_branch: { type: string }
        is_policy_repo: { type: boolean }
        repo_requirements:
          type: array
          items: { type: string, enum: [gates_green, one_approval] }
        resolved:
          type: array
          description: The union in force, each requirement annotated with every layer that asks for it.
          items:
            type: object
            required: [requirement, from]
            properties:
              requirement: { type: string, enum: [gates_green, one_approval] }
              from:
                type: array
                items: { type: string, enum: [instance, org, repo] }
    AuditLogEntry:
      type: object
      required: [id, actor_id, verb, target, created_at]
      description: >
        One row of `operations` (M4-3) — the same append-only spine every
        other write path already records to, projected for export. `repo_id`
        is null only for the handful of genuinely instance-level verbs
        `operations.repoId` documents as the reason the column is nullable;
        every audit-log row comes from a repo in the requested org, so this
        is not observed here in practice.
      properties:
        id: { type: string, format: uuid }
        repo_id: { type: string, format: uuid, nullable: true }
        actor_id: { type: string, format: uuid }
        verb: { type: string }
        target: { type: string }
        before: {}
        after: {}
        parent_op: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    Run:
      type: object
      required: [id, intent_id, orchestrator, external_ref, labels, status, final_git_sha, trajectory_digest, envelope, created_at, closed_at]
      properties:
        id: { type: string, format: uuid }
        intent_id: { type: string, format: uuid }
        orchestrator: { type: string }
        external_ref: { type: string, nullable: true }
        labels:
          type: object
          additionalProperties: { type: string }
        status: { type: string, enum: [open, closed, abandoned] }
        final_git_sha: { type: string, nullable: true }
        trajectory_digest: { type: string, nullable: true }
        envelope: { nullable: true, description: "DSSE envelope; null until the run closes." }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
    EvalResult:
      type: object
      required: [id, run_id, name, git_sha, spec_digest, score, passed, gate_result_id, trajectory_digest, reporter_principal, separately_authorized, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        name: { type: string }
        git_sha: { type: string, nullable: true }
        spec_digest: { type: string }
        score: { type: number, nullable: true }
        passed: { type: boolean }
        gate_result_id: { type: string, format: uuid, nullable: true }
        trajectory_digest: { type: string, nullable: true }
        reporter_principal: { type: string }
        separately_authorized: { type: boolean }
        created_at: { type: string, format: date-time }
    ComparisonEval:
      type: object
      required: [name, score, passed, specDigest, gateStatus]
      properties:
        name: { type: string }
        score: { type: number, nullable: true }
        passed: { type: boolean }
        specDigest: { type: string }
        gateStatus: { type: string }
    RunComparison:
      type: object
      required: [runId, externalRef, orchestrator, status, labels, finalGitSha, trajectoryDigest, eval, evals, events, tokensIn, tokensOut, costMicroUsd, durationMs, toolCalls, toolFailures, createdAt, closedAt]
      properties:
        runId: { type: string, format: uuid }
        externalRef: { type: string, nullable: true }
        orchestrator: { type: string }
        status: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        finalGitSha: { type: string, nullable: true }
        trajectoryDigest: { type: string, nullable: true }
        eval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ComparisonEval" }]
        evals:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ComparisonEval"
              - type: object
                required: [createdAt]
                properties:
                  createdAt: { type: string, format: date-time }
        events: { type: integer }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        costMicroUsd: { type: integer }
        durationMs: { type: integer }
        toolCalls: { type: integer }
        toolFailures: { type: integer }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    RunVerifySession:
      type: object
      required: [session_id, ok, event_count, head, broke_at_seq, reason, emitter_tracked, emitter_complete, emitter_first_gap, verified_from_seq, verified_to_seq, prefix, attested_heads_checked, not_retained, anchor]
      properties:
        session_id: { type: string, format: uuid }
        ok: { type: boolean }
        event_count: { type: integer }
        head: { type: string, nullable: true }
        broke_at_seq: { type: integer, nullable: true }
        reason: { type: string, nullable: true }
        emitter_tracked: { type: boolean }
        emitter_complete: { type: boolean }
        emitter_first_gap: { type: integer, nullable: true }
        verified_from_seq:
          type: integer
          description: >
            #152: exclusive lower bound of the range that was recomputed. 0 is
            the genesis.
        verified_to_seq:
          type: integer
          description: Inclusive upper bound of the range that was recomputed.
        attested_heads_checked:
          type: integer
          description: >
            #152: how many signed chain heads the recomputation passed through
            and agreed with. Recomputing from the genesis does not on its own
            detect an edit made *consistently* — rewrite an event, repair every
            hash after it, and the chain verifies perfectly. What pins the
            middle is a signature over a head the rewrite would have had to
            change, which is what each checkpoint holds. Zero on a session that
            was never checkpointed: a fact about the record, not a failure.
        not_retained:
          type: integer
          description: >
            #161: events in the verified range whose payload ADP no longer holds
            — aged out under the retention window — so their hash was taken as
            recorded rather than re-derived from their contents. Not a failure,
            and deliberately not folded into `ok`: it is a weaker claim about
            part of the range, and a reader has to be able to see which part.

            What it costs, precisely: for those events the typed columns are no
            longer independently verifiable either, because the hash covering
            them cannot be recomputed without the payload it also covers. What
            survives is the link — the stored hash is what the next event chains
            to — and any signed checkpoint head past them still pins the prefix,
            so a wholesale rewrite is still caught. That is the strongest
            guarantee available once a preimage is gone.
        prefix:
          type: string
          enum: [recomputed, attested, assumed]
          description: >
            #152: what is known about the events *before* `verified_from_seq`,
            and the field that keeps a partial answer from reading as a whole
            one. `recomputed` — there are none; every event was re-derived from
            its own contents, and pinned to every signed head it passed (see
            `attested_heads_checked`). `attested` — the prefix is vouched for by the
            checkpoint signature named in `anchor`: a prefix rewritten to stay
            internally consistent still fails, because its head would no longer
            be the one that was signed, and a prefix edited without repairing
            its hashes is the case this does not cover. `assumed` — the window
            was linked to what the database stores at its start, so it claims
            the window is internally consistent and claims nothing at all about
            what precedes it.
        anchor:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ChainAnchor"
    ChainAnchor:
      type: object
      description: >
        #152: the signed checkpoint a verification started from. Reported rather
        than kept server-side, because "the first 40,000 events were skipped
        because this envelope says so" is precisely the claim a reader has to be
        able to audit for themselves.
      required: [checkpoint_id, checkpoint_seq, event_count, head]
      properties:
        checkpoint_id: { type: string, format: uuid }
        checkpoint_seq:
          type: integer
          description: The checkpoint's own sequence number, which is not an event count.
        event_count:
          type: integer
          description: How many of the session's events the signature covers.
        head:
          type: string
          description: The chain head the signature commits to at that event count.
    SessionVerifyResult:
      description: >
        #152: one session's verification. The same per-session shape the run
        endpoint reports, plus the `coverage` that produced it — stated on the
        result rather than left to the caller to remember what it asked for.
      allOf:
        - type: object
          required: [coverage]
          properties:
            coverage:
              type: string
              enum: [full, from-checkpoint, range]
        - $ref: "#/components/schemas/RunVerifySession"
    RunVerifyResult:
      type: object
      required: [run_id, ok, coverage, chains_ok, emitters_ok, envelope_verified, trajectory_digest_matches, recomputed_trajectory_digest, attested_trajectory_digest, final_git_sha, attested_subject_sha, sessions]
      properties:
        run_id: { type: string, format: uuid }
        ok:
          type: boolean
          description: The single answer — false whenever any component check below is false.
        coverage:
          type: string
          enum: [full, from-checkpoint]
          description: >
            #152: how much of each chain `ok` was computed over. Required rather
            than present only on the anchored path — a reader who has to notice
            an absent key to learn that a verification was partial will not
            notice it.
        chains_ok: { type: boolean }
        emitters_ok: { type: boolean }
        envelope_verified: { type: boolean, nullable: true }
        trajectory_digest_matches: { type: boolean, nullable: true }
        recomputed_trajectory_digest: { type: string }
        attested_trajectory_digest: { type: string, nullable: true }
        final_git_sha: { type: string, nullable: true }
        attested_subject_sha: { type: string, nullable: true }
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/RunVerifySession"
    EvidenceBundle:
      type: object
      description: >
        Everything already signed and stored about one commit, assembled by one
        read: the change record, every gate result's DSSE envelope, and — since
        #157 — the unsigned edges to what produced it.
      required: [git_sha, change, gates, produced_by]
      properties:
        git_sha: { type: string }
        change:
          nullable: true
          description: Null when nothing recorded a change for this commit.
          type: object
          required: [id, intent_id, intent, provenance, signature, created_at]
          properties:
            id: { type: string, format: uuid }
            intent_id: { type: string, format: uuid, nullable: true }
            intent:
              nullable: true
              description: >
                #189/#157: the intent named rather than only referenced. Null
                when the change is unbound, which is ordinary — a commit pushed
                with no `ADP-Intent` trailer and never bound afterwards has no
                intent to name. Title only; the body belongs behind the intent's
                own read rather than inflating every bundle.
              type: object
              required: [id, title, issue_number]
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                issue_number:
                  type: integer
                  nullable: true
                  description: >
                    The issue carrying this intent, so a reader has something to
                    navigate to. Null is ordinary: `intents.source` is `issue`,
                    `task` or `api`, and only the first has a number.
            provenance: { description: What produced the change, as signed. }
            signature: { type: string }
            created_at: { type: string, format: date-time }
        gates:
          type: array
          description: Every gate result reported for this commit, most recent first.
          items:
            type: object
            required: [name, status, summary, envelope, created_at]
            properties:
              name: { type: string }
              status: { type: string }
              summary: { type: string }
              envelope: { description: The gate result's DSSE envelope, verbatim. }
              created_at: { type: string, format: date-time }
        produced_by:
          $ref: "#/components/schemas/ProducedBy"
    ProducedBy:
      type: object
      description: >
        #157: how to get from a commit to what produced it. **Navigation, not
        evidence** — nothing here is signed, and a caller verifying a commit
        should read `change` and `gates` instead. Every field is a join over a
        column that already exists for the purpose.
      required: [sessions, runs, proposals]
      properties:
        sessions:
          type: array
          description: >
            Sessions this commit names, by either of the two routes a commit has
            to one. A trajectory holding a commit event with this `git_sha`, and
            the session an `ADP-Session` trailer put in the change's provenance
            on a plain `git push` — the second is the ordinary case, and a join
            over `session_events` alone would answer only for commits some
            recorder happened to observe. Scoped to this repository:
            `session_events` has no repo column, and a sha is the caller's input
            rather than a secret.
          items:
            type: object
            required: [id, harness, run_id, seq]
            properties:
              id: { type: string, format: uuid }
              harness: { type: string }
              run_id: { type: string, format: uuid, nullable: true }
              seq:
                type: integer
                description: >
                  The first event in that session naming this commit, or 0 for a
                  session known only from a trailer — seqs are 1-based, so 0
                  means "no such event" rather than "the first one".
        runs:
          type: array
          description: >
            Runs those sessions belong to, plus any run that closed against this
            commit — a run whose final sha this is, but whose sessions recorded
            no commit event, is still the run that produced it.
          items:
            type: object
            required: [id, orchestrator, labels, status]
            properties:
              id: { type: string, format: uuid }
              orchestrator: { type: string }
              labels: { type: object, additionalProperties: { type: string } }
              status: { type: string, enum: [open, closed, abandoned] }
        proposals:
          type: array
          description: Proposals whose head is this commit.
          items:
            type: object
            required: [number, title, state]
            properties:
              number: { type: integer }
              title: { type: string }
              state: { type: string, enum: [open, closed, merged] }
    Operation:
      type: object
      description: >
        One entry in the operation log. Written in the same database transaction
        as the change it records, which is the invariant the whole log rests on.
      required: [id, actor_id, verb, target, before, after, parent_op, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        verb:
          type: string
          description: "`proposal.merge`, `change.create`, `session.checkpoint`, … — dotted, and never branched on by a client."
        target:
          type: string
          description: "What it acted on: `owner/name#7`, `owner/name@<sha>`, `owner/name@session:<uuid>`."
        before: { nullable: true, description: State before, verb-specific. }
        after: { nullable: true, description: State after, verb-specific. }
        parent_op:
          type: string
          format: uuid
          nullable: true
          description: >
            The operation this one is a consequence of — how an undo is linked
            to the merge it undoes, with no join table.
        created_at: { type: string, format: date-time }
    UndoResult:
      allOf:
        - $ref: "#/components/schemas/Operation"
        - type: object
          required: [undo_path]
          properties:
            undo_path:
              type: string
              enum: [rollback, revert]
              description: >
                #159: which path the undo took. `rollback` — the base ref was
                wound back and the proposal reopened; the change is out of the
                branch already. `revert` — the branch had moved, so a revert
                proposal was opened and the change is **not** out of the branch
                until that proposal lands. These are different facts about
                history and the log keeps them apart: the verb is
                `proposal.merge.undo` for the first and `proposal.merge.revert`
                for the second.
            proposal:
              description: Present only when `undo_path` is `revert`.
              type: object
              required: [number, title, head_ref, head_sha, base_ref, state]
              properties:
                number: { type: integer }
                title: { type: string }
                head_ref: { type: string, description: "The branch ADP created, `adp/revert-<n>`." }
                head_sha: { type: string }
                base_ref: { type: string }
                state: { type: string, enum: [open, closed, merged] }
            gate_jobs_enqueued:
              type: integer
              description: >
                Present only when `undo_path` is `revert`. How many gates were
                enqueued against the revert commit, read from its own
                `adp.yaml`. Zero means the repo declares no runner gates — not
                that enqueueing failed.
    UndoRefusal:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: >
            #159: `conflicts` is present only when a compensating revert could
            not be produced because the change has been built on since. Absent —
            not empty — on every other refusal, so a caller cannot mistake "no
            conflicts" for "a conflict with no files".
          properties:
            conflicts:
              type: array
              items: { type: string }
    LandRefusal:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          description: >
            #145: the refusal a land policy produces. A refusal is the moment
            the product proves itself, so it names not only what is unmet but
            what to do about it — `make demo` is built around reaching this
            response.

            `unmet` is one line per unsatisfied requirement, each carrying its
            own remedy and, where one exists, the literal command. A caller
            that only prints these lines has the whole answer.
            `unmet_detail` is the same facts with the seams left in, for a
            caller that wants the command without parsing a sentence. Both are
            absent on the other 422s this route can produce (already merged, a
            closed proposal, `merge_method: rebase`), which carry `message`
            alone.
          properties:
            unmet:
              type: array
              items:
                type: string
            unmet_detail:
              type: array
              items:
                $ref: "#/components/schemas/UnmetRequirement"
    UnmetRequirement:
      type: object
      required: [requirement, problem, remedy]
      description: >
        #145: one unsatisfied land requirement. `command` is absent — not
        empty, and never invented — where nothing a user can type satisfies
        it: a gate that ran and reported failure is satisfied by a new commit,
        and a confidence bound is satisfied by more passing runs or a looser
        policy.
      properties:
        requirement:
          type: string
          description: >
            The requirement name — `gates_green`, `gates_confident`,
            `one_approval`, or `org_kill_switch`. One entry *per gate* for the
            two gate requirements, because that is the grain a remedy is
            actionable at.
        problem:
          type: string
        remedy:
          type: string
        command:
          type: string
    Error:
      type: object
      required: [message]
      description: >
        #97: the one error shape every 4xx carries. `errors` appears on
        validation failures (422) and is a deliberate projection of the
        server's internal validator output — path, message, and a stable
        code — never the validator's raw issue objects, whose shape belongs
        to a library this contract must outlive.
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [path, message, code]
            properties:
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              message:
                type: string
              code:
                type: string
    MintedToken:
      type: object
      required:
        [token, identity_id, principal, scopes, org_id, expires_at, harness, model, session_id]
      description: >
        #90: the one-time response of POST /api/adp/tokens. `token` appears
        here and nowhere else — the server stores only its hash, so a lost
        token is re-minted, never recovered.
      properties:
        token:
          type: string
        identity_id:
          type: string
          format: uuid
        principal:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: ["repo:read", "repo:write", "runner"]
        org_id:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        harness:
          type: string
          nullable: true
          description: >
            #141: echoed back so a caller can confirm what it was issued.
            Null unless supplied at mint.
        model:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
    GateJob:
      type: object
      required: [id, repo_id, git_sha, name, image, command, timeout_ms, status, actor_id, created_at]
      description: >
        M4-9a: a queued unit of isolated gate execution. Queue-only — `status`
        transitions queued -> running (via claim) -> a terminal state (via
        complete); no runner attests anything about the isolation it ran
        under here, that lands in M4-9c once a real gate_results row is
        produced from a completed job.
      properties:
        id: { type: string, format: uuid }
        repo_id: { type: string, format: uuid }
        git_sha: { type: string, pattern: "^[0-9a-f]{40}$" }
        name: { type: string }
        image: { type: string }
        command: { type: string }
        timeout_ms: { type: integer }
        status:
          type: string
          enum: [queued, running, succeeded, failed, timed_out, error]
        actor_id: { type: string, format: uuid }
        claimed_by: { type: string, nullable: true }
        exit_code: { type: integer, nullable: true }
        logs: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    CreateRepoRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        default_branch:
          type: string
          default: main
    CreateIssueRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        body:
          type: string
    UpdateIssueRequest:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        state:
          type: string
          enum: [open, closed]
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
    CreateChangeRequest:
      type: object
      required: [git_sha]
      properties:
        git_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
        intent_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
    CreateProposalRequest:
      type: object
      required: [title, head, base]
      properties:
        title:
          type: string
        body:
          type: string
        head:
          type: string
          description: Branch name
        base:
          type: string
          description: Branch name
        change_id:
          type: string
          format: uuid
    UpdateProposalRequest:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        state:
          type: string
          enum: [open, closed]
    ReportGateRequest:
      type: object
      required: [git_sha, name, status]
      properties:
        git_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
        name:
          type: string
        status:
          type: string
          enum: [success, failure, pending]
        summary:
          type: string
        score:
          type: number
          description: >
            Optional numeric score, carried into the signed predicate so a
            candidate set's `best_score` policy ranks on attested evidence.
            Deliberately one typed field rather than a general predicate
            passthrough — the predicate is what gets signed, and arbitrary
            caller-supplied content would make the attestation a claim ADP
            merely relayed.
    CreateReviewRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [approved, changes_requested, commented]
        body:
          type: string
        annotations:
          type: array
          items:
            type: object
            required: [file, line, body]
            properties:
              file:
                type: string
              line:
                type: integer
              body:
                type: string
