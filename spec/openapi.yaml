openapi: 3.1.0
info:
  title: ADP API
  version: 0.7.0
  description: >
    Native and compat-plane HTTP surface for ADP.

    Two planes share this file. `/api/v3` is the GitHub-compatible surface, kept
    faithful enough that unmodified `gh` works against it. `/api/adp` is the
    native plane, which has no GitHub analogue: workspaces, candidate sets,
    sessions and checkpoints, the operation log, and evidence bundles.

    Completeness is enforced, not aspirational: server/src/spec-coverage.test.ts
    enumerates the server's real route table and fails if this file and the
    implementation describe different APIs in either direction. Deliberate
    omissions are the git smart-HTTP wire protocol (specified by git itself and
    proxied verbatim), the loopback-only receive-path hook endpoints, and the
    inbound GitHub webhook receiver, whose payload contract is GitHub's.

    `info.version` above is the contract version, and every response carries it
    in an `ADP-API-Version` header — including 401s and 404s, so a generated
    client can pin before it authenticates. The git smart-HTTP routes are the
    exception: they are proxied verbatim and are not part of this contract.
    See docs/api-compatibility.md for what a version bump promises.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness probe (checks DB connectivity)
      responses:
        "200":
          description: OK
        "503":
          description: Not ready
  /api/graphql:
    post:
      summary: >
        GraphQL endpoint. GitHub's real public schema SDL
        (spec/graphql/github.graphql), loaded unmodified — that file, not
        this OpenAPI doc, is the source of truth for the GraphQL surface.
        Only a subset of fields have resolvers; everything else is a valid
        query that fails as a resolver
        error, never a validation error. Currently backed: Query.repository,
        Query.node, Query.viewer, Repository.{owner,defaultBranchRef,issue,
        issues,pullRequest,pullRequests}, Issue.author, PullRequest.author.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                variables:
                  type: object
                operationName:
                  type: string
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: >
            Always 200 per GraphQL convention — check the response body's
            `errors` array.
  /api/v3:
    get:
      summary: Identity root probe (gh auth status / Octokit clients)
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
  /api/v3/user:
    get:
      summary: Authenticated user
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
  /api/v3/rate_limit:
    get:
      summary: Rate limit status (stubbed; ADP does not rate-limit in the MVP)
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
  /api/v3/repos/{owner}:
    post:
      x-required-scope: "repo:write"
      summary: Create a repository
      security:
        - bearerAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRequest"
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: Created
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed or repo already exists
  /api/v3/repos/{owner}/{repo}:
    get:
      security:
        - bearerAuth: []
      x-required-scope: "repo:read"
      summary: Get a repository
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
  /api/v3/repos/{owner}/{repo}/issues:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      x-required-scope: "repo:write"
      summary: File an issue (also creates an intent)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: Created
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Repository not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
    get:
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, maximum: 100, default: 30 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      security:
        - bearerAuth: []
      x-required-scope: "repo:read"
      summary: List issues
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Repository not found
  /api/v3/repos/{owner}/{repo}/issues/{number}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: number
        in: path
        required: true
        schema:
          type: integer
    get:
      security:
        - bearerAuth: []
      x-required-scope: "repo:read"
      summary: Get an issue
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
    patch:
      x-required-scope: "repo:write"
      summary: Update an issue (title, body, or state — open/closed)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
  /api/v3/repos/{owner}/{repo}/issues/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: number
        in: path
        required: true
        schema:
          type: integer
    post:
      x-required-scope: "repo:write"
      summary: Comment on an issue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: Created
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
    get:
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, maximum: 100, default: 30 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      security:
        - bearerAuth: []
      x-required-scope: "repo:read"
      summary: List comments on an issue
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
  /api/v3/repos/{owner}/{repo}/changes:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      x-required-scope: "repo:write"
      summary: >
        Record a typed change: an existing git commit plus intent and
        provenance, server-signed. No GitHub shape — native ADP metadata
        living beside the commit.

        Idempotent by `(repo, git_sha)`: a push already auto-records a signed
        change for every new commit, so calling this for a sha the push
        recorded *completes* that row — filling in `intent_id` and
        `workspace_id` and re-signing over the binding — rather than adding a
        second row beside it. The provenance of an existing row is left as
        recorded: it names what produced the commit, and this call is a
        binding, whose actor is in the operation log. `201` on both paths;
        `created_at` is the push's timestamp when a row was completed rather
        than created.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeRequest"
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: >
            The one change record for this sha — created, or completed with
            the binding this call supplied.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Repository not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: >
            The sha is already bound to a different `intent_id` or
            `workspace_id`. A binding is a claim about what produced that
            commit, so it is recorded once and not rewritten.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: git_sha is not a commit in this repo, or intent_id doesn't belong to it
  /api/v3/repos/{owner}/{repo}/changes/{id}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      security:
        - bearerAuth: []
      x-required-scope: "repo:read"
      summary: Get a signed change record
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
  /api/v3/repos/{owner}/{repo}/pulls:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      x-required-scope: "repo:write"
      summary: >
        Open a proposal (PR-shaped). Numbered independently from issues —
        real GitHub shares one sequence across both; a known fidelity gap,
        not yet closed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposalRequest"
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: Created
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Repository not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: head/base branch not found, or change_id doesn't belong to this repo
    get:
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, maximum: 100, default: 30 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      security:
        - bearerAuth: []
      x-required-scope: "repo:read"
      summary: List proposals
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Repository not found
  /api/v3/repos/{owner}/{repo}/pulls/{number}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/number"
    get:
      security:
        - bearerAuth: []
      x-required-scope: "repo:read"
      summary: >
        Get a proposal.

        #155: `?land=1` adds a `land` block saying whether this would land right
        now and, when it would not, every unmet requirement with its remedy and
        — where one exists — the literal command that satisfies it. Until this
        the only way to find out why a change would not land was to *try to land
        it*, which is a strange thing to have to do to ask a question, and which
        `adp watch` cannot do on a loop.

        Opt-in because evaluating the policy reads gate results, the org's
        policy repo out of git, and flake statistics — a cost `gh pr view`
        should not pay on a route it uses constantly. Present only on an open
        proposal: a merged or closed one has no verdict to give.
      parameters:
        - name: land
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
          description: Include the land verdict. Costs a policy evaluation.
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
    patch:
      x-required-scope: "repo:write"
      summary: Update a proposal (title, body, or state — open/closed)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProposalRequest"
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed, or proposal is already merged
  /api/v3/repos/{owner}/{repo}/pulls/{number}/merge:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/number"
    put:
      x-required-scope: "repo:write"
      summary: >
        Land a proposal, gated on evidence.

        Land policy is resolved two-level — instance floor ∧ the repo's
        `adp.yaml` — and re-checked immediately before the ref compare-and-swap,
        which narrows but does not close the window a superseding gate result
        could land in (git and Postgres are not one transaction). Requirements
        are `gates_green`, `one_approval`, and `gates_confident`, the last
        gating on the Wilson lower bound of a gate's trailing pass rate.
        `one_approval` is author-independent: an approving review from the
        proposal's own author does not satisfy it. A gate
        that disagrees with itself often enough is quarantined: it stops
        blocking, but visibly, and the quarantine is recorded as an operation.

        A non-fast-forward base is the MVP's conflict model: 409, the agent
        rebases and retries. `merge_method` then decides what lands —
        `merge` (default, matching GitHub) or `squash`. `rebase` is a typed 422,
        not implemented.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merge_method:
                  type: string
                  enum: [merge, squash, rebase]
                  default: merge
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Merged
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Base has diverged from head — not a fast-forward
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandRefusal"
          description: >
            Land policy not satisfied (body carries `unmet` and
            `unmet_detail`), already merged, the proposal is closed, or
            `merge_method: rebase`.
  /api/v3/repos/{owner}/{repo}/pulls/{number}/reviews:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/number"
    post:
      x-required-scope: "repo:write"
      summary: >
        Submit a typed review (approved / changes_requested / commented) —
        not a GitHub-shaped emoji thread.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: Created
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
    get:
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, maximum: 100, default: 30 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      security:
        - bearerAuth: []
      x-required-scope: "repo:read"
      summary: List reviews on a proposal
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
  /metrics:
    get:
      summary: >
        Prometheus text-format counters — REST by route pattern/method/status,
        GraphQL by root field/operation type/outcome. Unauthenticated, like the
        probes above: an operator's scraper, not a repo-scoped resource.
      responses:
        "200":
          description: Prometheus exposition format
  /version:
    get:
      summary: >
        What commit this process is running, captured at deploy time rather
        than read per request. Unauthenticated for the same reason as the
        probes and /metrics. `builtAt` is null when the deploy left no stamp.
      responses:
        "200":
          description: Build and process identity
          content:
            application/json:
              schema:
                type: object
                required: [sha, ref, startedAt, uptimeSeconds]
                properties:
                  sha:
                    type: string
                    example: 60be968f0a4a2a4f5f7c0f9e1d2c3b4a5968ab01
                  ref:
                    type: string
                    example: main
                  builtAt:
                    type: string
                    nullable: true
                    format: date-time
                  startedAt:
                    type: string
                    format: date-time
                  uptimeSeconds:
                    type: integer
  /api/v3/:
    get:
      summary: >
        Same as /api/v3. Registered under both spellings deliberately: `gh auth
        status` probes the trailing-slash form, and the tidy fix
        (ignoreTrailingSlash) breaks the static UI's directory index.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: API root
  /api/v3/user/repos:
    post:
      x-required-scope: "repo:write"
      summary: Create a repository owned by the authenticated user (GitHub-shaped).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRequest"
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: Created
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed, or the repository already exists
  /api/v3/orgs/{org}/repos:
    parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
    post:
      x-required-scope: "repo:write"
      summary: Create a repository owned by an org (GitHub-shaped).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRequest"
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: Created
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed, or the repository already exists
  /api/v3/repos/{owner}/{repo}/contents/{path}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/path"
    get:
      x-required-scope: "repo:read"
      summary: File or directory contents at a ref (`?ref=`), GitHub-shaped.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: A file object, or an array of entries for a directory
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
  /api/v3/repos/{owner}/{repo}/commits:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      x-required-scope: "repo:read"
      summary: Commit list, newest first. `?sha=` selects the starting ref.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Commits
  /api/v3/repos/{owner}/{repo}/commits/{sha}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/sha"
    get:
      x-required-scope: "repo:read"
      summary: A single commit.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
