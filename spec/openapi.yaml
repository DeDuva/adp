openapi: 3.1.0
info:
  title: ADP API
  version: 0.0.0-mvp
  description: >
    Native and compat-plane HTTP surface for ADP. This file grows with each
    milestone; M0 only covers the walking-skeleton endpoints. GitHub REST
    compatibility endpoints (mounted at /api/v3) are a separate obligation
    tracked here as they're implemented — see docs/pragmatic_mvp.md §2.4.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness probe (checks DB connectivity)
      responses:
        "200":
          description: OK
        "503":
          description: Not ready
  /api/v3:
    get:
      summary: Identity root probe (gh auth status / Octokit clients)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v3/user:
    get:
      summary: Authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v3/rate_limit:
    get:
      summary: Rate limit status (stubbed; ADP does not rate-limit in the MVP)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v3/repos/{owner}:
    post:
      summary: Create a repository
      security:
        - bearerAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRequest"
      responses:
        "201":
          description: Created
        "422":
          description: Validation failed or repo already exists
  /api/v3/repos/{owner}/{repo}:
    get:
      summary: Get a repository
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/issues:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: File an issue (also creates an intent)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Created
        "404":
          description: Repository not found
        "422":
          description: Validation failed
    get:
      summary: List issues
      responses:
        "200":
          description: OK
        "404":
          description: Repository not found
  /api/v3/repos/{owner}/{repo}/issues/{number}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: number
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get an issue
      responses:
        "200":
          description: OK
        "404":
          description: Not found
    patch:
      summary: Update an issue (title, body, or state — open/closed)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: OK
        "404":
          description: Not found
        "422":
          description: Validation failed
  /api/v3/repos/{owner}/{repo}/issues/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: number
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Comment on an issue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Created
        "404":
          description: Not found
        "422":
          description: Validation failed
    get:
      summary: List comments on an issue
      responses:
        "200":
          description: OK
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/changes:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: >
        Record a typed change: an existing git commit plus intent and
        provenance, server-signed. No GitHub shape — native ADP metadata
        living beside the commit (docs/pragmatic_mvp.md §2.2). Recorded via
        explicit call; not yet triggered automatically by a git push.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeRequest"
      responses:
        "201":
          description: Created
        "404":
          description: Repository not found
        "422":
          description: git_sha is not a commit in this repo, or intent_id doesn't belong to it
  /api/v3/repos/{owner}/{repo}/changes/{id}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a signed change record
      responses:
        "200":
          description: OK
        "404":
          description: Not found
components:
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
    repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateRepoRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        default_branch:
          type: string
          default: main
    CreateIssueRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        body:
          type: string
    UpdateIssueRequest:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        state:
          type: string
          enum: [open, closed]
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
    CreateChangeRequest:
      type: object
      required: [git_sha]
      properties:
        git_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
        intent_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
