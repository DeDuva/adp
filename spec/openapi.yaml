    post:
      x-required-scope: "repo:write"
      summary: >
        Undo an operation. The undo is itself an operation, so the causal record
        is preserved rather than erased.

        **Two paths, and the response says which one ran** (#159). A *rollback*
        winds the base ref back with the same compare-and-swap the merge used,
        and is available only while the ref still points where the merge left
        it — which is what makes it exact: nothing else landed, so nothing else
        is lost. Once something has landed on top, that path is gone, and until
        #159 so was undo: it worked right up until somebody else pushed.

        A *compensating revert* is the second path. It produces the change that
        takes the merge back out on top of whatever landed since, as a
        **proposal** — so `undo_path: revert` means "here is the change that
        undoes it", not "it is undone". That is deliberate: a revert is a
        change, and an undo that bypassed the land policy would be a hole in the
        gate opened by the one verb most likely to be used in a hurry. The
        proposal's gates are enqueued from its own `adp.yaml`, because a
        proposal nothing will ever report a gate result for cannot land under
        the default floor.

        A revert that conflicts with what landed after it is refused with the
        conflicting paths named, never merged with markers left in the tree.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: >
            The recorded undo operation, plus which path it took. The operation
            is the top-level object, so a client reading only the operation
            fields keeps working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoResult"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoRefusal"
          description: >
            Not undoable, already undone, or a compensating revert that could
            not be produced — the branch's history was rewritten, the merge is
            already reverted, or the revert conflicts (`conflicts` names the
            paths).
  /api/v3/users/{owner}:
    get:
      x-required-scope: "repo:read"
      summary: >
        #196: resolve an owner. `gh repo create <owner>/<name>` calls this
        before creating, to decide whether the owner is a user or an
        organization, and then creates through the GraphQL `createRepository`
        mutation using the `node_id` returned here.

        It answers `Organization` because that is what ADP's owners are —
        `repos.owner` is the org's immutable URL slug — and `gh` branches on
        this field to choose the org creation path.

        Owner-shaped, not person-shaped: it returns the organization and never
        its membership, so it cannot become a way to enumerate principals.
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No such owner. Organizations are provisioned explicitly (#91), so
            this usually means "not created yet" — the body says so rather than
            leaving the caller to guess.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/adp/repos/{owner}/{repo}/export:
    get:
      x-required-scope: "repo:read"
      summary: >
        #239: this repository's record, so it can leave the instance holding it.

        `PUBLIC_URL` is part of the signed record rather than a display string,
        which is stated in docs/self-hosting.md as a property of the design — and
        the consequence nobody had written down is that a record could not move.
        Every adoption path in Phase 5 ends with a developer's record living on
        an instance chosen while they were evaluating alone.

        The bundle carries the intents, issues, proposals, changes, gate results,
        runs and the operation log, plus **the exporting instance's public key
        and its `PUBLIC_URL`** — without which every signature in it is
        unverifiable on the receiving instance, and an unverifiable record is not
        evidence.

        Git history is **not** in the bundle, and that is a boundary rather than
        an omission: a change record references a commit, and the commit travels
        by `git push`.
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The repository's record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportBundle"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/adp/repos/{owner}/{repo}/import:
    post:
      x-required-scope: "admin"
      summary: >
        #239: take a record in, keeping every signature exactly as it was.

        **Nothing is re-signed.** A signature says "this instance attested this,
        then", and re-signing under the receiving instance would let it assert
        what it did not witness — the substitution this product exists to
        prevent. So the records keep their original signatures and the exporting
        instance's key is archived here, which is the same mechanism a retired
        key already used, pointed at a key this instance never held.

        `admin` rather than `repo:write`: this writes signed records this
        instance did not produce and adds a verification key to it, which is a
        trust decision about another instance.

        Idempotent by row — importing the same bundle twice is a no-op — because
        a migration that half-failed has to be safe to run again. The repository
        must already exist: creating it as a side effect would let an import
        place a repository under an org the caller was never admitted to.
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportBundle"
      responses:
        "200":
          description: What was taken in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Requires the `admin` scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such repository here — create it first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A bundle in a shape this instance does not read, or naming no signing key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/adp/repos/{owner}/{repo}/intents/{id}:
    get:
      x-required-scope: "repo:read"
      summary: >
        #241: the intent's own text.

        Every route that touched an intent returned its *id* — the issue create,
        the change record, the run — or its title as one line inside an evidence
        bundle. A client holding an intent id had no way to read what was
        actually asked for, which is exactly what `adp reimplement` and
        `adp bakeoff --launch` have to give the harness they are about to run: a
        bake-off whose arms were each given a different instruction would compare
        the instructions rather than the harnesses.

        Read-only. Intents are created as a side effect of filing an issue, and a
        route that edited one would let the goal a run is scored against change
        after the scoring.
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such repository, or no such intent in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/adp/github-app:
    get:
      x-required-scope: "repo:read"
      summary: >
        #232: the GitHub App this instance created for itself, if it has one.
        Setting up companion mode used to cost a personal access token and a
        webhook made by hand in GitHub's settings; an App replaces both, and
        it is the only credential GitHub's Checks API accepts at all, which is
        what the `ADP / change record` and `ADP / policy` check runs need.

        Never returns a secret, not even truncated: the private key can mint an
        installation token for every repository the App is installed on, and a
        read route that can leak one is a read route somebody eventually points
        at a log.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The instance's GitHub App
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubApp"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            This instance has no GitHub App. Not a misconfiguration — it is an
            instance that has not run the manifest flow, and the body names
            where to start it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/adp/github-app/callback:
    get:
      summary: >
        #232: where GitHub redirects after the App manifest is converted,
        carrying a single-use code this instance exchanges for the App's
        credentials.

        Deliberately unauthenticated, and safe to be. It is reachable only with
        a `state` this instance signed, the code is single-use and short-lived
        at GitHub's end, and it refuses outright once an App exists — so the
        worst a stranger can do with it is spend a code they do not have.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: GitHub's single-use manifest conversion code
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: The signed state issued by GET /github-app/new
      responses:
        "200":
          description: The App GitHub created, and where to install it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAppCreated"
        "400":
          description: Missing or expired state, or no conversion code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This instance already has a GitHub App
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: GitHub refused the manifest conversion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/adp/orgs:
    post:
      x-required-scope: "admin"
      summary: >
        #91: provision an organization, explicitly and audited. Until this
        route, orgs came into being as a side effect of naming an unseen
        owner string on repo-create, which made per-org quotas escapable by
        anyone. Requires the `admin` scope; the org's name must be a valid
        owner path segment; the creator is seeded as an owner-member; the
        act is recorded as an `org.create` operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: The provisioned organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSummary"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Requires the `admin` scope
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid name, or an org by this name already exists
    get:
      x-required-scope: "repo:read"
      summary: >
        M4-7: the organizations this token can see — at most one. Access is
        granted by the token being scoped to an org (auth/plugin.ts's
        requireOrgAccess), not by the identity's memberships, so a human in
        several orgs still sees one per token. An empty array means the token
        is not org-scoped, which is the state every pre-M4 token is in.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Organizations visible to this token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgSummary"
  /api/adp/orgs/{orgId}:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      x-required-scope: "repo:read"
      summary: >
        M4-7: an org's policy posture in one read — the floor it contributes
        and where that floor came from, the instance floor it sits on top of,
        its kill switch, and each quota beside its current usage.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Organization detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDetail"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token is not scoped to this org, or not a member
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No such organization
    patch:
      x-required-scope: "admin"
      summary: >
        M4-7 + #97: org administration, audited. The kill switch refuses
        every land attempt for every repo in the org while it is on
        (core/land-policy.ts); the three quota ceilings bound repos, live
        workspaces, and concurrently-running gate jobs (null clears one —
        "unlimited"); policy_repo_id points at the repo whose policy.yaml is
        the org's land floor, and must name a repo in this org. Requires the
        `admin` scope, not `repo:write` — none of this is something the
        ability to push code should carry. Every change is recorded in the
        operation log in the same transaction (`org.kill_switch`,
        `org.quota_update`, `org.policy_repo_set`), carrying the org so the
        audit-log export includes it. The org's land floor is deliberately
        NOT editable here: it is a `policy.yaml` changed by landing a change,
        so policy travels the same signed, reviewable path as code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kill_switch: { type: boolean }
                max_repos: { type: integer, nullable: true, minimum: 0 }
                max_concurrent_workspaces: { type: integer, nullable: true, minimum: 0 }
                max_concurrent_gate_jobs: { type: integer, nullable: true, minimum: 0 }
                max_storage_bytes: { type: integer, nullable: true, minimum: 0 }
                trajectory_retention_days:
                  type: integer
                  nullable: true
                  minimum: 0
                  description: >
                    #161: how long this org keeps trajectory payloads, in days.
                    **Null defers to the instance window rather than meaning
                    unlimited** — the opposite of the quotas above, and
                    deliberately so: an org that has never been configured and
                    one that has chosen to keep everything are different states,
                    and 0 is how the second says it. Audited under its own verb,
                    `org.retention_update`, because deciding what ADP stops
                    holding is a different act from bounding what it may write.
                policy_repo_id: { type: string, format: uuid, nullable: true }
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: The updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSummary"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Requires the admin scope, or the token is not scoped to this org
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No such organization
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
  /api/adp/orgs/{orgId}/repos:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      x-required-scope: "repo:read"
      summary: >
        M4-7: every repo in the org with the land requirements that actually
        resolve for it right now (instance ∪ org ∪ repo, the union
        core/repo-policy.ts's resolveLandRequirements computes), each one
        annotated with which layers ask for it. This is the answer to "why does
        this repo require an approval?" that otherwise means reading two YAML
        files out of two repos and knowing how the union works.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Repos in the org with their resolved land policy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgRepoPolicy"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token is not scoped to this org, or not a member
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No such organization
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
  /api/adp/orgs/{orgId}/audit-log:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      parameters:
        - name: cursor
          in: query
          description: >
            #147: opaque keyset cursor from a previous page's ADP-Next-Cursor
            response header, ordered on `(created_at, id)` descending. Before
            this, an export larger than one page could only be walked with
            `since`/`until`, which is lossy across rows sharing a timestamp —
            and operations written in one transaction do.
          schema: { type: string }
      x-required-scope: "repo:read"
      summary: >
        M4-3: the operation log across every repo in an org — a projection of
        `operations`, not a second system. Filterable by `verb`, `actor`,
        `since`, `until`, `limit`, pageable with `cursor`; `format=ndjson`
        (default) or `format=csv` for direct ingestion by a compliance tool.
        Requires a token scoped to this org (auth/plugin.ts's
        requireOrgAccess), not just repo:read.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: >
            The org's operations, newest first. One `AuditLogEntry` per line
            for `application/x-ndjson` (the default); the same fields as CSV
            columns for `text/csv`.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/AuditLogEntry"
            text/csv:
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Token is not scoped to this org, or not a member
  /api/adp/repos/{owner}/{repo}/evidence/{sha}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/sha"
    get:
      x-required-scope: "repo:read"
      summary: >
        The consolidated evidence bundle for a commit: its signed change plus
        every gate result's DSSE envelope. One read answers "what landed, who
        produced it, why, and how was it verified".

        #189: `change.intent` names the intent by title, alongside the
        `intent_id` that was there before. Title only — an evidence bundle is
        read to answer why a line exists, and the intent's body belongs behind
        its own read rather than inflating every bundle. Null when the change
        is unbound, which is an ordinary state rather than an error.

        #157: `change.intent` also carries `issue_number`, and `produced_by`
        carries the three edges out of a commit — the sessions that produced it
        (via `session_events.git_sha`, which is typed on commit events precisely
        so this join needs no payload parsing), the runs those sessions belong
        to or that closed against this commit, and any proposal whose head this
        is. That block is **navigation, not evidence**: nothing in it is signed
        and none of it changes what the bundle attests. It is here because the
        alternative is a reader holding the identifier of the thing they want
        and no way to follow it.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Evidence bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceBundle"
  /api/adp/repos/{owner}/{repo}/gate-jobs:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      parameters:
        - name: limit
          in: query
          schema: { type: integer, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous page's ADP-Next-Cursor response header.
          schema: { type: string }
      x-required-scope: "repo:read"
      summary: List gate jobs for this repo, newest first.
      security:
        - bearerAuth: []
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "200":
          description: Gate jobs
          content:
            application/json:
              schema:
                type: object
                required: [gate_jobs]
                properties:
                  gate_jobs:
                    type: array
                    items: { $ref: "#/components/schemas/GateJob" }
    post:
      x-required-scope: "repo:write"
      summary: >
        M4-9a: enqueue an isolated gate run. Queue only — no runner executes
        anything here yet (M4-9b); a runner instance-wide polls
        `/api/adp/gate-jobs/claim` and reports back via
        `/api/adp/gate-jobs/{id}/complete`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [git_sha, name, image, command]
              properties:
                git_sha:
                  type: string
                  pattern: "^[0-9a-f]{40}$"
                name:
                  type: string
                image:
                  type: string
                command:
                  type: string
                timeout_ms:
                  type: integer
                  default: 300000
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateJob"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Repository not found
  /api/adp/tokens:
    post:
      x-required-scope: "admin"
      summary: >
        Mint a token for a principal (found or created; created identities
        default to kind "agent"). Requires the `admin` scope. The scope set
        is bounded — `admin` itself cannot be minted here; creating an admin
        stays a host-level bootstrap action. The minted token is scoped to
        the calling token's own org: an org-scoped admin mints within their
        org only, and there is no request parameter that reaches any other.
        This is how a deployment mints its runner's `runner`-scoped token,
        which since #90 is the only token type the gate-job claim, checkout,
        and complete routes accept (`admin` no longer satisfies `runner`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal, scopes]
              properties:
                principal:
                  type: string
                kind:
                  type: string
                  enum: [human, agent]
                  default: agent
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: ["repo:read", "repo:write", "runner"]
                expires_at:
                  type: string
                  format: date-time
                harness:
                  type: string
                  description: >
                    #141: the harness this credential belongs to
                    ("claude-code", "codex", …). Carried onto every signed
                    change the token records, as `provenance.harness`.
                model:
                  type: string
                  description: >
                    #141: the model the integration this credential belongs
                    to is built around. This is the credential's grain, not
                    the attempt's — a harness may switch models mid-session
                    and the token outlives the switch; which model produced a
                    particular attempt belongs on `runs.labels`.
                session_id:
                  type: string
                  description: >
                    #141: the harness session this credential was minted for,
                    carried onto signed changes as `provenance.session_id`.
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid token
        "201":
          description: >
            The minted token — returned once, in this response only; the
            server stores only its hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedToken"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Requires the `admin` scope
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed (unknown scope, empty scope set, bad expiry)
  /auth/oidc/start:
    get:
      summary: >
        Begin an OIDC authorization-code login. Mounted only on instances
        configured with IdP credentials; absent entirely otherwise, rather
        than present and refusing. Redirects to the provider's authorization
        endpoint with PKCE (S256), `state`, and `nonce`, and sets a short-lived
        HttpOnly cookie binding that flow to this browser. Unauthenticated by
        design — this is where a person who has no token yet begins.
      responses:
        "302":
          description: Redirect to the identity provider's authorization endpoint
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: >
                HttpOnly, SameSite=Lax, Path=/auth/oidc flow cookie carrying
                the state, nonce and PKCE verifier under an HMAC.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The identity provider's discovery document could not be fetched
  /auth/oidc/callback:
    get:
      summary: >
        Complete a login. Verifies `state` against the flow cookie, redeems
        the authorization code with PKCE, verifies the ID token's signature
        and claims (issuer, audience, expiry, nonce), then resolves the
        verified subject to an identity and mints a token.

        Admission fails closed: a subject with no existing
        `external_identities` link is refused unless its verified email
        domain is in the instance's configured allowlist, which is empty by
        default. The minted token carries `repo:read` and `repo:write` only —
        `admin` is not reachable from this route by any input.
      parameters:
        - in: query
          name: code
          schema:
            type: string
          description: Authorization code from the provider
        - in: query
          name: state
          schema:
            type: string
          description: Must match the flow cookie set by /auth/oidc/start
        - in: query
          name: error
          schema:
            type: string
          description: Set by the provider when the user declined or the request was rejected
      responses:
        "200":
          description: >
            The minted token — returned once, in this response only; the
            server stores only its hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedToken"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: >
            No login in progress, a `state` mismatch, a missing code, or an
            error reported by the provider
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: >
            The ID token verified, but this person may not have a token here —
            no linked identity and no permitted email domain, an unverified
            email, or a failed claim check
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The provider could not be reached, or returned no id_token
