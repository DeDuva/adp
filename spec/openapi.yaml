        allowance rather than the per-event one, because a checkpoint is a
        whole harness's resumable state rather than one turn of it. A breach is
        a 422 naming the limit, never a truncation: the DSSE envelope commits
        to a digest of `state`, so a silently shortened state would produce a
        signature over something the harness never wrote.
      security:
        - bearerAuth: []
      requestBody:
