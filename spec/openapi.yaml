                $ref: "#/components/schemas/GateJob"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The job is held by a different runner identity's claim
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gate job not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gate job is not `running` — was never claimed, or was already completed
