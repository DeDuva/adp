        (squash — one landed change per set) through the ordinary land path, and
        reclaim the losers' workspaces. Losing proposals are closed and their
        branches deleted, but their rows and evidence are never removed: the
        discarded attempts stay queryable without polluting history.
        Land is serial — speculative batching is not implemented.
