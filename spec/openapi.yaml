openapi: 3.1.0
info:
  title: ADP API
  version: 0.2.0
  description: >
    Native and compat-plane HTTP surface for ADP — see docs/pragmatic_mvp.md
    §2.4 for what is in scope and §2.5 for what is deliberately cut.

    Two planes share this file. `/api/v3` is the GitHub-compatible surface, kept
    faithful enough that unmodified `gh` works against it. `/api/adp` is the
    native plane, which has no GitHub analogue: workspaces, candidate sets,
    sessions and checkpoints, the operation log, and evidence bundles.

    Completeness is enforced, not aspirational: server/src/spec-coverage.test.ts
    enumerates the server's real route table and fails if this file and the
    implementation describe different APIs in either direction. Deliberate
    omissions are the git smart-HTTP wire protocol (specified by git itself and
    proxied verbatim), the loopback-only receive-path hook endpoints, and the
    inbound GitHub webhook receiver, whose payload contract is GitHub's.

    `info.version` above is the contract version, and every response carries it
    in an `ADP-API-Version` header — including 401s and 404s, so a generated
    client can pin before it authenticates. The git smart-HTTP routes are the
    exception: they are proxied verbatim and are not part of this contract.
    See docs/api-compatibility.md for what a version bump promises.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness probe (checks DB connectivity)
      responses:
        "200":
          description: OK
        "503":
          description: Not ready
  /api/graphql:
    post:
      summary: >
        GraphQL endpoint. GitHub's real public schema SDL
        (spec/graphql/github.graphql), loaded unmodified — that file, not
        this OpenAPI doc, is the source of truth for the GraphQL surface.
        Only a subset of fields have resolvers (docs/pragmatic_mvp.md §2.4
        Tier 3); everything else is a valid query that fails as a resolver
        error, never a validation error. Currently backed: Query.repository,
        Query.node, Query.viewer, Repository.{owner,defaultBranchRef,issue,
        issues,pullRequest,pullRequests}, Issue.author, PullRequest.author.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                variables:
                  type: object
                operationName:
                  type: string
      responses:
        "200":
          description: >
            Always 200 per GraphQL convention — check the response body's
            `errors` array.
  /api/v3:
    get:
      summary: Identity root probe (gh auth status / Octokit clients)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v3/user:
    get:
      summary: Authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v3/rate_limit:
    get:
      summary: Rate limit status (stubbed; ADP does not rate-limit in the MVP)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v3/repos/{owner}:
    post:
      summary: Create a repository
      security:
        - bearerAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRequest"
      responses:
        "201":
          description: Created
        "422":
          description: Validation failed or repo already exists
  /api/v3/repos/{owner}/{repo}:
    get:
      summary: Get a repository
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/issues:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: File an issue (also creates an intent)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Created
        "404":
          description: Repository not found
        "422":
          description: Validation failed
    get:
      summary: List issues
      responses:
        "200":
          description: OK
        "404":
          description: Repository not found
  /api/v3/repos/{owner}/{repo}/issues/{number}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: number
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get an issue
      responses:
        "200":
          description: OK
        "404":
          description: Not found
    patch:
      summary: Update an issue (title, body, or state — open/closed)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: OK
        "404":
          description: Not found
        "422":
          description: Validation failed
  /api/v3/repos/{owner}/{repo}/issues/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: number
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Comment on an issue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Created
        "404":
          description: Not found
        "422":
          description: Validation failed
    get:
      summary: List comments on an issue
      responses:
        "200":
          description: OK
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/changes:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: >
        Record a typed change: an existing git commit plus intent and
        provenance, server-signed. No GitHub shape — native ADP metadata
        living beside the commit (docs/pragmatic_mvp.md §2.2). Recorded via
        explicit call; not yet triggered automatically by a git push.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeRequest"
      responses:
        "201":
          description: Created
        "404":
          description: Repository not found
        "422":
          description: git_sha is not a commit in this repo, or intent_id doesn't belong to it
  /api/v3/repos/{owner}/{repo}/changes/{id}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a signed change record
      responses:
        "200":
          description: OK
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/pulls:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: >
        Open a proposal (PR-shaped). Numbered independently from issues —
        real GitHub shares one sequence across both; a known fidelity gap,
        not yet closed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposalRequest"
      responses:
        "201":
          description: Created
        "404":
          description: Repository not found
        "422":
          description: head/base branch not found, or change_id doesn't belong to this repo
    get:
      summary: List proposals
      responses:
        "200":
          description: OK
        "404":
          description: Repository not found
  /api/v3/repos/{owner}/{repo}/pulls/{number}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/number"
    get:
      summary: Get a proposal
      responses:
        "200":
          description: OK
        "404":
          description: Not found
    patch:
      summary: Update a proposal (title, body, or state — open/closed)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProposalRequest"
      responses:
        "200":
          description: OK
        "404":
          description: Not found
        "422":
          description: Validation failed, or proposal is already merged
  /api/v3/repos/{owner}/{repo}/pulls/{number}/merge:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/number"
    put:
      summary: >
        Land a proposal, gated on evidence.

        Land policy is resolved two-level — instance floor ∧ the repo's
        `adp.yaml` — and re-checked immediately before the ref compare-and-swap,
        which narrows but does not close the window a superseding gate result
        could land in (git and Postgres are not one transaction). Requirements
        are `gates_green`, `one_approval`, and `gates_confident`, the last
        gating on the Wilson lower bound of a gate's trailing pass rate. A gate
        that disagrees with itself often enough is quarantined: it stops
        blocking, but visibly, and the quarantine is recorded as an operation.

        A non-fast-forward base is the MVP's conflict model: 409, the agent
        rebases and retries. `merge_method` then decides what lands —
        `merge` (default, matching GitHub) or `squash`. `rebase` is a typed 422,
        not implemented.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merge_method:
                  type: string
                  enum: [merge, squash, rebase]
                  default: merge
      responses:
        "200":
          description: Merged
        "404":
          description: Not found
        "409":
          description: Base has diverged from head — not a fast-forward
        "422":
          description: >
            Land policy not satisfied (body carries `unmet`), already merged,
            the proposal is closed, or `merge_method: rebase`.
  /api/v3/repos/{owner}/{repo}/pulls/{number}/reviews:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/number"
    post:
      summary: >
        Submit a typed review (approved / changes_requested / commented) —
        not a GitHub-shaped emoji thread.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Created
        "404":
          description: Not found
        "422":
          description: Validation failed
    get:
      summary: List reviews on a proposal
      responses:
        "200":
          description: OK
        "404":
          description: Not found
  /metrics:
    get:
      summary: >
        Prometheus text-format counters — REST by route pattern/method/status,
        GraphQL by root field/operation type/outcome. Unauthenticated, like the
        probes above: an operator's scraper, not a repo-scoped resource.
      responses:
        "200":
          description: Prometheus exposition format
  /version:
    get:
      summary: >
        What commit this process is running, captured at deploy time rather
        than read per request. Unauthenticated for the same reason as the
        probes and /metrics. `builtAt` is null when the deploy left no stamp.
      responses:
        "200":
          description: Build and process identity
          content:
            application/json:
              schema:
                type: object
                required: [sha, ref, startedAt, uptimeSeconds]
                properties:
                  sha:
                    type: string
                    example: 60be968f0a4a2a4f5f7c0f9e1d2c3b4a5968ab01
                  ref:
                    type: string
                    example: main
                  builtAt:
                    type: string
                    nullable: true
                    format: date-time
                  startedAt:
                    type: string
                    format: date-time
                  uptimeSeconds:
                    type: integer
  /api/v3/:
    get:
      summary: >
        Same as /api/v3. Registered under both spellings deliberately: `gh auth
        status` probes the trailing-slash form, and the tidy fix
        (ignoreTrailingSlash) breaks the static UI's directory index.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API root
  /api/v3/user/repos:
    post:
      summary: Create a repository owned by the authenticated user (GitHub-shaped).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRequest"
      responses:
        "201":
          description: Created
        "422":
          description: Validation failed, or the repository already exists
  /api/v3/orgs/{org}/repos:
    parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Create a repository owned by an org (GitHub-shaped).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRequest"
      responses:
        "201":
          description: Created
        "422":
          description: Validation failed, or the repository already exists
  /api/v3/repos/{owner}/{repo}/contents/{path}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/path"
    get:
      summary: File or directory contents at a ref (`?ref=`), GitHub-shaped.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A file object, or an array of entries for a directory
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/commits:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      summary: Commit list, newest first. `?sha=` selects the starting ref.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Commits
  /api/v3/repos/{owner}/{repo}/commits/{sha}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/sha"
    get:
      summary: A single commit.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Commit
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/commits/{sha}/gates:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/sha"
    get:
      summary: >
        Gate results reported against a commit. This is the ADP equivalent an
        agent is pointed at when it asks a non-mirrored repo for Actions runs.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Gate results, most recent per gate name
  /api/v3/repos/{owner}/{repo}/compare/{path}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/path"
    get:
      summary: Compare two refs (`{base}...{head}`), GitHub-shaped.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Comparison
        "404":
          description: Either ref could not be resolved
  /api/v3/repos/{owner}/{repo}/pulls/{number}/files:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/number"
    get:
      summary: Files changed by a proposal.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Changed files
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/git/refs:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      summary: All refs. Paginated with `per_page`/`page`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Refs
    post:
      summary: Create a ref.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref, sha]
              properties:
                ref:
                  type: string
                sha:
                  type: string
      responses:
        "201":
          description: Created
  /api/v3/repos/{owner}/{repo}/git/refs/{path}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/path"
    get:
      summary: >
        Refs matching a prefix — GitHub's own shape, so this returns an **array**
        even when the prefix names exactly one ref.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Matching refs
        "404":
          description: No ref matches the prefix
  /api/v3/repos/{owner}/{repo}/git/refs/heads/{branch}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: branch
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Delete a branch ref.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/git/blobs:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: Create a blob.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                encoding:
                  type: string
                  enum: [utf-8, base64]
      responses:
        "201":
          description: Created
  /api/v3/repos/{owner}/{repo}/git/blobs/{sha}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/sha"
    get:
      summary: Read a blob.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Blob
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/git/trees:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: >
        Create a tree. `base_tree` accepts any commit-ish, not only a tree sha —
        the server resolves it with `git ls-tree`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tree]
              properties:
                base_tree:
                  type: string
                tree:
                  type: array
                  items:
                    type: object
      responses:
        "201":
          description: Created
  /api/v3/repos/{owner}/{repo}/git/trees/{sha}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/sha"
    get:
      summary: Read a tree.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tree
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/git/commits:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: Create a commit object.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, tree, parents]
              properties:
                message:
                  type: string
                tree:
                  type: string
                parents:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Created
  /api/v3/repos/{owner}/{repo}/git/commits/{sha}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/sha"
    get:
      summary: Read a commit object.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Commit
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/gates:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: >
        Report a gate result against a commit. The server is the receiving and
        attestation end — it runs nothing. The response's `envelope` is a signed
        DSSE-wrapped in-toto Statement, and *is* the evidence; the other fields
        are a queryable projection of it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportGateRequest"
      responses:
        "201":
          description: Recorded
        "422":
          description: Validation failed
  /api/v3/repos/{owner}/{repo}/dependency-admission:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: >
        Admission verdict for a lockfile diff — three-way `admit`/`quarantine`/
        `block` per package, recorded as an ordinary gate result. `quarantine`
        reports gate status `pending`, which `gates_green` already treats as
        not-green, so a repo opts in by naming the gate in adp.yaml.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Verdict recorded
        "422":
          description: Validation failed
  /api/v3/repos/{owner}/{repo}/hooks:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      summary: List outbound webhook subscriptions. The secret is never returned.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hooks
    post:
      summary: >
        Subscribe to outbound events (`push`, `pull_request`, `gate_result`).
        Deliveries are HMAC-SHA256 signed with GitHub's `X-Hub-Signature-256`
        header shape. The secret is write-only, and encrypted at rest.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                active:
                  type: boolean
                events:
                  type: array
                  items:
                    type: string
                    enum: [push, pull_request, gate_result]
                config:
                  type: object
                  required: [url, secret]
                  properties:
                    url:
                      type: string
                      format: uri
                    secret:
                      type: string
      responses:
        "201":
          description: Created
        "422":
          description: Validation failed
  /api/v3/repos/{owner}/{repo}/hooks/{hookId}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: hookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: A single webhook subscription.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hook
        "404":
          description: Not found
    delete:
      summary: Delete a webhook subscription.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /api/v3/repos/{owner}/{repo}/mirror:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      summary: The repository's mirror configuration and recent sync log.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Mirror
        "404":
          description: Not mirrored
    post:
      summary: >
        Configure mirroring against a GitHub remote. The credential and the
        inbound webhook secret are encrypted at rest; `webhook_secret` is
        returned exactly once, at creation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remote_url, direction, credential]
              properties:
                remote_url:
                  type: string
                direction:
                  type: string
                  enum: [outbound, inbound, both]
                credential:
                  type: string
      responses:
        "201":
          description: Created
        "422":
          description: Validation failed, or the repository is already mirrored
    delete:
      summary: Stop mirroring.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Not mirrored
  /api/v3/repos/{owner}/{repo}/actions/runs:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      summary: >
        Relayed upstream for a mirrored repo — a passthrough, not an
        implementation. ADP never executes workflow YAML (§2.5). Non-mirrored
        repos and mirrors that are disabled get a self-describing 404 naming
        the ADP equivalent; every write path (dispatch, re-run, cancel) stays
        404 permanently.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Upstream response, relayed verbatim and never recorded
        "404":
          description: Not mirrored — body names the ADP equivalent
        "502":
          description: >
            Upstream unreachable or rate-limited. Never a synthesized empty run
            list: an agent that believes CI passed because the proxy fabricated
            silence is the worst outcome available here.
  /api/v3/repos/{owner}/{repo}/actions/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: runId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: A single upstream workflow run, relayed. See /actions/runs.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Upstream response
        "404":
          description: Not mirrored
        "502":
          description: Upstream failed
  /api/v3/repos/{owner}/{repo}/actions/runs/{runId}/jobs:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - name: runId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Jobs for an upstream workflow run, relayed. See /actions/runs.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Upstream response
        "404":
          description: Not mirrored
        "502":
          description: Upstream failed
  /api/v3/repos/{owner}/{repo}/actions/workflows:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      summary: Upstream workflow definitions, relayed. See /actions/runs.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Upstream response
        "404":
          description: Not mirrored
        "502":
          description: Upstream failed
  /api/adp/repos/{owner}/{repo}/workspaces:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      summary: List workspaces.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspaces
    post:
      summary: >
        Fork a workspace from a base ref. A workspace is deliberately just a
        branch `adp/ws/<id>` with lifecycle metadata — no new storage mechanism,
        no VFS.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_ref]
              properties:
                base_ref:
                  type: string
                ttl_hours:
                  type: number
      responses:
        "201":
          description: Created
        "422":
          description: Base ref not found
  /api/adp/repos/{owner}/{repo}/workspaces/{id}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    delete:
      summary: >
        Destroy a workspace: deletes its branch and stamps `destroyedAt`. The
        row is kept so the operation log stays a complete history.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Destroyed
        "422":
          description: Not found, or already destroyed
  /api/adp/repos/{owner}/{repo}/operations:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      summary: >
        The append-only operation log — every mutation, written in the same
        transaction as the state change it describes. Filterable by `verb`,
        `actor`, `path`, `since`, `until`, `limit`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operations, newest first
  /api/adp/repos/{owner}/{repo}/operations/{id}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    get:
      summary: A single operation.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operation
        "404":
          description: Not found
  /api/adp/repos/{owner}/{repo}/operations/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    post:
      summary: >
        Undo an operation — operation-log undo with the causal record preserved,
        not revert-as-new-commit. The undo is itself an operation.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The recorded undo operation
        "422":
          description: This operation is not undoable, or was already undone
  /api/adp/repos/{owner}/{repo}/evidence/{sha}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/sha"
    get:
      summary: >
        The consolidated evidence bundle for a commit: its signed change plus
        every gate result's DSSE envelope. One read answers "what landed, who
        produced it, and how was it verified".
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Evidence bundle
  /api/adp/repos/{owner}/{repo}/candidate-sets:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      summary: List candidate sets, newest first.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Candidate sets
    post:
      summary: >
        Open a candidate set against one intent — N proposals fanned out, one
        selected. The MVP feature GitHub structurally cannot express (§2.2).
        Proposals join by passing `candidate_set_id` at creation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent_id]
              properties:
                intent_id:
                  type: string
                  format: uuid
                selection_policy:
                  type: string
                  enum: [manual, first_green, best_score]
                  default: manual
      responses:
        "201":
          description: Created
        "422":
          description: Intent not found in this repository
  /api/adp/repos/{owner}/{repo}/candidate-sets/{id}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    get:
      summary: >
        A candidate set with every candidate's head sha, score, and gate
        verdicts — the comparison view's read model.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Candidate set
        "404":
          description: Not found
  /api/adp/repos/{owner}/{repo}/candidate-sets/{id}/select:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    post:
      summary: >
        Record which candidate won. This only records the choice — /resolve is
        what acts on it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal_id]
              properties:
                proposal_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Updated
        "422":
          description: Not a candidate in this set
  /api/adp/repos/{owner}/{repo}/candidate-sets/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    post:
      summary: >
        Finish a fan-out: pick the winner by the set's selection policy, land it
        (squash — one landed change per set) through the ordinary land path, and
        reclaim the losers' workspaces. Losing proposals are closed and their
        branches deleted, but their rows and evidence are never removed: the
        discarded attempts stay queryable without polluting history.
        Land is serial — speculative batching is not implemented.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proposal_id:
                  type: string
                  format: uuid
                  description: Resolve this candidate regardless of policy. Required for an unselected `manual` set.
      responses:
        "200":
          description: Resolved — the landed proposal and what was reclaimed
        "409":
          description: The base moved during the land; retry
        "422":
          description: >
            No winner under the policy, the set is already resolved, or the
            winner failed land policy (the set stays open).
  /api/adp/repos/{owner}/{repo}/sessions:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: >
        Start a session — a unit of agent work that outlives any one harness.
        `harness` is an opaque identifier ADP never branches on; that is what
        makes the protocol harness-neutral rather than harness-aware.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [harness]
              properties:
                harness:
                  type: string
                intent_id:
                  type: string
                  format: uuid
                workspace_id:
                  type: string
                  format: uuid
                run_id:
                  type: string
                  format: uuid
                  description: >
                    The orchestrator run this session belongs to. The session
                    inherits the run's intent.
      responses:
        "201":
          description: Created
        "409":
          description: The run is closed or abandoned
        "422":
          description: Intent, workspace, or run not found in this repository
  /api/adp/repos/{owner}/{repo}/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    get:
      summary: >
        A session with its checkpoints and its full resume lineage — the chain
        back to the session that started the work, however many harnesses it
        passed through.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session, lineage, and checkpoints
        "404":
          description: Not found
  /api/adp/repos/{owner}/{repo}/sessions/{id}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    get:
      summary: A session's checkpoints, in sequence order.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checkpoints
        "404":
          description: Not found
    post:
      summary: >
        Checkpoint a session at a commit, with opaque harness state. The
        response's `envelope` is a signed DSSE statement binding the commit and
        a SHA-256 digest of `state` — see spec/schemas/checkpoint.json. `state`
        is never parsed by ADP, so a harness storing its own format needs no
        protocol change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [git_sha]
              properties:
                git_sha:
                  type: string
                  pattern: "^[0-9a-f]{40}$"
                harness:
                  type: string
                state: {}
      responses:
        "201":
          description: Created
        "409":
          description: The session is closed
        "422":
          description: The commit could not be resolved in this repository
  /api/adp/repos/{owner}/{repo}/sessions/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    post:
      summary: >
        Resume a session under a (possibly different) harness. Verifies the
        checkpoint's DSSE signature **and** re-derives its state digest before
        forking a workspace at the checkpointed commit — an unverified resume
        would make "one continuous signed history" false while looking true.
        Creates a new session linked by `resumed_from_session_id`, and records
        `session.resume` with `parentOp` pointing at the checkpoint's own
        operation. The old session is never mutated beyond its status.
        Defaults to the latest checkpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [harness]
              properties:
                harness:
                  type: string
                checkpoint_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: The new session, what it resumed from, and its workspace
        "404":
          description: Session not found
        "422":
          description: >
            No checkpoint to resume from, or the checkpoint failed signature or
            state-digest verification.
  /api/adp/repos/{owner}/{repo}/sessions/{id}/close:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    post:
      summary: Close a session. Idempotent.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Closed
        "404":
          description: Not found
  /api/adp/repos/{owner}/{repo}/sessions/{id}/events:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/id"
    post:
      summary: >
        Append to a session's trajectory — every message, model call, tool
        execution, handoff, commit, and test result. Events are hash-chained
        rather than individually signed: the chain head is what checkpoint and
        run attestations commit to, so recording stays cheap enough to always
        happen while tampering anywhere in the sequence stays detectable.
        Batched, and idempotent under retry when `client_event_id` is supplied.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [kind]
                    properties:
                      kind:
                        type: string
                        enum:
                          [message, model_call, tool_call, handoff, commit, test_result, custom]
                      type:
                        type: string
                        description: The harness's own name within that kind. Never branched on.
                      payload:
                        description: Opaque to ADP — never parsed, never validated beyond "it is JSON".
                      status:
                        type: string
                        enum: [success, failure, error, rejected, skipped]
                      model:
                        type: string
                      tokens_in:
                        type: integer
                      tokens_out:
                        type: integer
                      cost_micro_usd:
                        type: integer
                      duration_ms:
                        type: integer
                      git_sha:
                        type: string
                        description: Set on commit events; joins the trajectory to the change record.
                      related_session_id:
                        type: string
                        format: uuid
                        description: >
                          Set on handoff events. This event on session A naming
                          session B is the edge A→B.
                      client_event_id:
                        type: string
                        description: The emitter's own id; a repeat is dropped rather than appended twice.
                      producer_seq:
                        type: integer
                        minimum: 1
                        description: >
                          The emitter's own contiguous counter for this session,
                          starting at 1. `client_event_id` makes a retry
                          harmless but cannot prove nothing was dropped — an
                          event that never arrived has no id to deduplicate.
                          This can: a batch that skips a number is rejected
                          whole with 409 and `expected_next_seq`. Set it on
                          every event of a batch or on none; an emitter that
                          does not count is untracked, not incomplete.
                      occurred_at:
                        type: string
                        format: date-time
                producer_id:
                  type: string
                  description: >
                    Who is counting — recorded on the events of this batch that
                    carry a producer_seq. Batch-level rather than per-event
                    because a chain has exactly one writer.
      responses:
        "201":
          description: >
            Appended, with the new chain head, any duplicates that were skipped,
            and `accepted_through` — the highest producer_seq durably stored for
            this session, which is the mark an emitter trims its spool against
            (null when the session is untracked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAppendResult"
        "409":
          description: >
            The session is closed, or the batch skips the emitter's numbering.
            In the latter case the body carries `expected_next_seq`, the
            producer_seq the session is waiting for, so a spool knows where to
            replay from rather than guessing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  expected_next_seq:
                    type: integer
                    description: >
                      The producer_seq this session is waiting for. Present only
                      on a contiguity rejection, which is the case a spool needs
                      it for; absent when the session is simply closed.
        "422":
          description: >
            Validation failed, related_session_id is not in this repository, or
            producer_seq was set on some events of the batch but not all.
    get:
      summary: A session's trajectory in sequence order, with each event's chain hashes.
      security:
        - bearerAuth: []
      parameters:
        - name: kinds
          in: query
          schema:
            type: string
          description: Comma-separated event kinds.
        - name: since
          in: query
          schema:
            type: integer
          description: Return events after this seq.
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTrajectory"
        "404":
          description: Not found
  /api/adp/repos/{owner}/{repo}/runs:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    post:
      summary: >
        Open a run — an orchestrator's unit of assigned work, spanning the
        sessions it spawns to do it. `orchestrator` is opaque in the way
        `harness` is. When `external_ref` names a run that already exists, the
        existing run is returned with 200 instead of a second run being created,
        so an orchestrator restarting after a crash rejoins rather than forking
        the trajectory in two.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent_id, orchestrator]
              properties:
                intent_id:
                  type: string
                  format: uuid
                orchestrator:
                  type: string
                external_ref:
                  type: string
                  description: The orchestrator's own id for the assignment.
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: >
                    What this run was — vendor, model, tier. Set at open and
                    immutable: they are covered by the run attestation, so a
                    label that could be edited afterwards would leave the
                    envelope and the row disagreeing. There is no update route.
                    Ranking consumers read these rather than parsing
                    `external_ref`, whose format nothing enforces.
      responses:
        "200":
          description: Rejoined an open run with this external_ref
        "201":
          description: Created
        "409":
          description: A run with this external_ref is already closed or abandoned
        "422":
          description: Intent not found in this repository
    get:
      summary: Runs in this repository, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: intent_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, abandoned]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Runs
  /api/adp/repos/{owner}/{repo}/runs/compare:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
    get:
      summary: >
        N runs against one intent, each pairing its attested eval outcome with
        what the trajectory cost to produce it — the table eval-based
        optimization is read off. Ranked by score descending; unscored runs sort
        last, because unmeasured is not the same as scoring zero.
      security:
        - bearerAuth: []
      parameters:
        - name: intent_id
          in: query
          schema:
            type: string
            format: uuid
        - name: eval
          in: query
          schema:
            type: string
          description: Restrict the paired eval to this name.
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: >
            One row per run, carrying its `labels`, the single latest `eval`,
            and `evals` — the latest result per eval *name*. A run scored on
            several axes has several results, and a consumer ranking per axis
            reads `evals`; `eval` alone would show whichever score was recorded
            last.
  /api/adp/repos/{owner}/{repo}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    get:
      summary: A run with its sessions, their chain heads, and its evals.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Run
        "404":
          description: Not found
  /api/adp/repos/{owner}/{repo}/runs/{runId}/close:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    post:
      summary: >
        Close a run against the commit it produced, signing a DSSE attestation
        that binds that sha to every session's trajectory chain head. Any
        still-open session is closed here: the attestation names each chain
        head, so a session that could still append afterwards would leave an
        attestation that no longer describes the trajectory. Idempotent on the
        same sha; 409 on a different one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [final_git_sha]
              properties:
                final_git_sha:
                  type: string
      responses:
        "200":
          description: Closed, with the signed attestation
        "404":
          description: Not found
        "409":
          description: Already closed against a different sha, or abandoned
        "422":
          description: The commit could not be resolved in this repository
  /api/adp/repos/{owner}/{repo}/runs/{runId}/abandon:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    post:
      summary: >
        Abandon a run that produced no commit. The trajectory is kept — the
        discarded attempts staying queryable is the point — and the run's
        sessions are closed.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Abandoned
        "404":
          description: Not found
        "409":
          description: Cannot abandon a closed run
  /api/adp/repos/{owner}/{repo}/runs/{runId}/trajectory:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    get:
      summary: >
        The run's whole trajectory, merged across its sessions in the order
        things actually happened.
      security:
        - bearerAuth: []
      parameters:
        - name: kinds
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Events
        "404":
          description: Not found
  /api/adp/repos/{owner}/{repo}/runs/{runId}/stats:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    get:
      summary: >
        What the run cost and what it spent it on: counts and tokens by event
        kind, per-tool call and failure counts, per-model spend, the handoff
        graph, and the commits the run produced.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stats
        "404":
          description: Not found
  /api/adp/repos/{owner}/{repo}/runs/{runId}/verify:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    get:
      summary: >
        Recompute every session's hash chain from the stored rows and check the
        run attestation against them. Tamper-evidence nobody can check is
        decoration; this is what makes the guarantee falsifiable by any holder
        of a read token. Reports where a chain first broke, by seq.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >
            Verification result. `chains_ok` says the events ADP holds were not
            edited; `emitters_ok` says ADP was given all of them, per session as
            `emitter_tracked`/`emitter_complete`/`emitter_first_gap` — two
            different guarantees, since a chain can verify perfectly and still be
            missing an event that never arrived. Top-level `ok` is false if
            either fails, or if the attestation does not check out. `evals`
            carries each score's `reporter_principal` and
            `separately_authorized`.
        "404":
          description: Not found
  /api/adp/repos/{owner}/{repo}/runs/{runId}/evals:
    parameters:
      - $ref: "#/components/parameters/owner"
      - $ref: "#/components/parameters/repo"
      - $ref: "#/components/parameters/runId"
    post:
      summary: >
        Attach a deterministic eval result to a run, as gate evidence. The eval
        *is* a gate result — same signing, same table, same land policy and `gh
        pr checks` projection — and the signed predicate binds the score to the
        run, the commit, the trajectory digest, and the digest of the eval
        definition that produced it. Report under `gate_name: score` to feed a
        candidate set's `best_score` selection.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, passed]
              properties:
                name:
                  type: string
                passed:
                  type: boolean
                score:
                  type: number
                summary:
                  type: string
                spec:
                  description: The eval definition; digested to make the result identifiable.
                spec_digest:
                  type: string
                  description: Supply directly if the eval harness already content-addresses its suites.
                gate_name:
                  type: string
                  description: Defaults to `eval:<name>`.
                git_sha:
                  type: string
                  description: Defaults to the run's final_git_sha.
                metrics:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: >
            Recorded, with the gate result it was reported as, plus
            `reporter_principal` and `separately_authorized` — the latter true
            when the identity reporting the score is not the one that opened the
            run, i.e. the score is not a self-report.
        "404":
          description: Run not found
        "422":
          description: The run has no final_git_sha and no git_sha was supplied
    get:
      summary: >
        The evals recorded against this run, newest first, each carrying
        `reporter_principal` and `separately_authorized`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Evals
        "404":
          description: Not found
components:
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
    repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
    number:
      name: number
      in: path
      required: true
      schema:
        type: integer
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sha:
      name: sha
      in: path
      required: true
      schema:
        type: string
    path:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: Matches the rest of the URL, including slashes.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    # ── Native-plane response shapes ────────────────────────────────────────
    #
    # Responses were prose-only until 2026-08-08. The first external consumer
    # generated a client from this document and got two of five fields of the
    # append result wrong — `head` was described as "the chain head" and read as
    # `chain_head`, and `duplicates` reads as a count in prose while it is a list
    # of client_event_ids. Requests were typed and responses were not, so a
    # generated client could only ever type half the contract, and the untyped
    # half is where a consumer's bugs live. See issue #64.
    TrajectoryEvent:
      type: object
      description: One event in a session's hash-chained trajectory.
      required: [id, session_id, seq, kind, type, payload, occurred_at, hash, prev_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        seq:
          type: integer
          description: ADP's own position in this session's chain, assigned server-side.
        kind:
          type: string
          enum: [message, model_call, tool_call, handoff, commit, test_result, custom]
        type:
          type: string
          description: The harness's own name within that kind. Free-form; never branched on.
        payload:
          type: object
          description: >
            Opaque to ADP, and never parsed by it. Defaults to `{}` when the
            event carried none — the endpoint declares only `kind` as required.
          additionalProperties: true
        status:
          type: string
          nullable: true
          enum: [success, failure, error, rejected, skipped]
        model: { type: string, nullable: true }
        tokens_in: { type: integer, nullable: true }
        tokens_out: { type: integer, nullable: true }
        cost_micro_usd: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        git_sha: { type: string, nullable: true }
        related_session_id: { type: string, format: uuid, nullable: true }
        client_event_id:
          type: string
          nullable: true
          description: The emitter's own id, which makes a retried batch idempotent.
        producer_seq: { type: integer, nullable: true }
        producer_id: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
        hash:
          type: string
          description: This event's chain hash, covering every field above and the previous hash.
        prev_hash: { type: string }
        created_at: { type: string, format: date-time }
    EventAppendResult:
      type: object
      required: [session_id, appended, duplicates, count, head, accepted_through, events]
      properties:
        session_id: { type: string, format: uuid }
        appended:
          type: integer
          description: How many events this call actually stored. A **count**.
        duplicates:
          type: array
          description: >
            **A list of `client_event_id`s, not a count** — the ids that were
            already present and therefore skipped. Reported rather than silently
            absorbed: an emitter re-sending a landed batch has a bug, and silence
            would let it stay one. Note that `if duplicates:` behaves the same
            whether this is a list or a count, so a client that assumed a count
            breaks only when a duplicate actually occurs — during a retry, which
            is exactly when the recorder is already in trouble.
          items: { type: string }
        count:
          type: integer
          description: The session's total event count after this append.
        head:
          type: string
          description: >
            The new chain head. **Named `head`, not `chain_head`** — this is the
            value a checkpoint or run attestation commits to.
        accepted_through:
          type: integer
          nullable: true
          description: >
            The highest producer_seq durably stored for this session, and the
            mark an emitter trims its spool against. Null when the session is
            untracked — an emitter that does not count is untracked, not
            incomplete.
        events:
          type: array
          items: { $ref: "#/components/schemas/TrajectoryEvent" }
    SessionTrajectory:
      type: object
      required: [session_id, events]
      properties:
        session_id: { type: string, format: uuid }
        events:
          type: array
          items: { $ref: "#/components/schemas/TrajectoryEvent" }
    CreateRepoRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        default_branch:
          type: string
          default: main
    CreateIssueRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        body:
          type: string
    UpdateIssueRequest:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        state:
          type: string
          enum: [open, closed]
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
    CreateChangeRequest:
      type: object
      required: [git_sha]
      properties:
        git_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
        intent_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
    CreateProposalRequest:
      type: object
      required: [title, head, base]
      properties:
        title:
          type: string
        body:
          type: string
        head:
          type: string
          description: Branch name
        base:
          type: string
          description: Branch name
        change_id:
          type: string
          format: uuid
    UpdateProposalRequest:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        state:
          type: string
          enum: [open, closed]
    ReportGateRequest:
      type: object
      required: [git_sha, name, status]
      properties:
        git_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
        name:
          type: string
        status:
          type: string
          enum: [success, failure, pending]
        summary:
          type: string
        score:
          type: number
          description: >
            Optional numeric score, carried into the signed predicate so a
            candidate set's `best_score` policy ranks on attested evidence.
            Deliberately one typed field rather than a general predicate
            passthrough — the predicate is what gets signed, and arbitrary
            caller-supplied content would make the attestation a claim ADP
            merely relayed.
    CreateReviewRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [approved, changes_requested, commented]
        body:
          type: string
        annotations:
          type: array
          items:
            type: object
            required: [file, line, body]
            properties:
              file:
                type: string
              line:
                type: integer
              body:
                type: string
