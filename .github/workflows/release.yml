# #101: release identity. Until this existed the repo had zero tags, zero
# releases, no CHANGELOG, and no published image — a consumer could pin only
# a raw SHA, and since there is deliberately no hosted staging rung, the
# pinnable artifact IS the separation
# between active development and what stakeholders depend on.
#
# Trigger is a version tag, pushed by a human after the release PR merges.
# The rule the tag carries: the git tag and the served ADP-API-Version move
# together — vX.Y.Z tags a commit whose server/src/api-version.ts says X.Y.Z
# (asserted below, so a mismatched tag fails loudly instead of publishing a
# lie).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  # The OIDC token npm's trusted publisher authenticates against. It is also
  # what attests the tarball's provenance — under trusted publishing npm does
  # that automatically, which is why the publish below passes no
  # `--provenance` flag.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The GitHub Actions environment npm's trusted publisher is bound to. The
    # OIDC claim carries this name, so it and the one configured on the package
    # must match exactly or authentication fails outright — and it is where a
    # required reviewer goes, on the one job in this repository that does
    # something irreversible in public. npm's unpublish window is 72 hours, and
    # after it the version number is spent for good.
    environment: npm
    steps:
      - uses: actions/checkout@v4

      # Pinned from .nvmrc rather than taking whatever the runner ships: `cli`
      # declares `engines: node >=22`, and until now this job built it on the
      # image's default.
      #
      # Deliberately no `registry-url`. That would write an `.npmrc` whose auth
      # token expands from `NODE_AUTH_TOKEN`, which under trusted publishing does
      # not exist — leaving an empty credential for npm to trip over. The default
      # registry is already registry.npmjs.org, and OIDC needs no credential
      # file at all, so the safest thing to write is nothing.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Tag matches the served contract version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP 'export const API_VERSION = "\K[^"]+' server/src/api-version.ts)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag but api-version.ts serves $version — these move together (#101)"; exit 1
          fi

      # The tag check above compares the pushed tag to api-version.ts and nothing
      # else. Every other surface a consumer reads — the spec, the chart operators
      # deploy, the package manifests, the CHANGELOG this workflow is about to
      # publish as release notes — went unchecked, and drifted. This is the same
      # guard CI runs per-push, re-run here because this is the last point before
      # an image goes public.
      - name: Every version surface agrees
        env:
          ADP_REQUIRE_GH: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/dev/check-release.sh

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/deduva/adp:${{ github.ref_name }}
            ghcr.io/deduva/adp:latest
          build-args: |
            ADP_GIT_SHA=${{ github.sha }}

      # helm/adp/values.yaml has pointed the optional runner deployment at
      # ghcr.io/deduva/adp-runner since M4-12, and nothing has ever built or pushed
      # that image — deploy/Dockerfile.runner existed but no workflow used it. The
      # runner is `enabled: false` by default, which is the only reason it went
      # unnoticed: anyone who turned it on got a reference to nothing.
      - name: Build and push the runner image
        id: push-runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.runner
          push: true
          tags: |
            ghcr.io/deduva/adp-runner:${{ github.ref_name }}
            ghcr.io/deduva/adp-runner:latest

      # #235: the CLI, on npm.
      #
      # Until this, `cli/package.json` was `private: true` and the documented
      # install was a source build — so ADP could not be obtained without
      # cloning it, and every front door this phase widened opened onto a
      # building with no road.
      #
      # It publishes by OIDC now, against the trusted publisher configured on
      # the package, and holds no credential at all.
      #
      # What that costs is the graceful skip this step used to have: it ran only
      # when NPM_TOKEN was set, so a fork could still cut a release that produced
      # an image and a GitHub release. A fork will now *fail* here, because it is
      # not the trusted publisher — which is the correct answer for this
      # repository and a sharp edge for anyone else's. The old behaviour was
      # worse in the way that matters more: under trusted publishing there is no
      # token, so an unchanged skip would have looked at an empty NODE_AUTH_TOKEN
      # and silently published nothing, on a release that went green.
      - name: Publish the CLI to npm
        run: |
          # Trusted publishing needs npm 11.5.1 or newer, and Node 22 ships npm
          # 10 — so the version pinned above is the right Node and the wrong
          # npm. Upgraded to a floor rather than to `@latest`, so a future npm
          # major cannot arrive unannounced in the middle of a release.
          npm install -g npm@^11.5.1
          npm ci --prefix cli
          npm run build --prefix cli
          # No token, and no `.npmrc`. The credential is the OIDC token the
          # `id-token: write` permission mints, exchanged against the trusted
          # publisher configured on the package — so there is nothing here to
          # leak, nothing to rotate, and nothing left on disk if this step
          # fails. Provenance is attested automatically under trusted
          # publishing, which is why `--provenance` is gone rather than
          # forgotten.
          npm publish --prefix cli --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
          RUNNER_DIGEST: ${{ steps.push-runner.outputs.digest }}
        # Notes assembled in a file, not an inline quoted string — a
        # multi-line --notes argument is exactly the shape that silently
        # breaks the YAML block scalar (it did, on this workflow's first
        # run: the unindented continuation lines ended the block).
        run: |
          awk "/^## ${GITHUB_REF_NAME}/{flag=1;next}/^## v/{flag=0}flag" CHANGELOG.md > /tmp/notes.md
          printf '\n**Image:** `ghcr.io/deduva/adp:%s`\n' "$GITHUB_REF_NAME" >> /tmp/notes.md
          printf '**Digest:** `%s` — pin with `ADP_IMAGE=ghcr.io/deduva/adp@%s`\n' "$DIGEST" "$DIGEST" >> /tmp/notes.md
          printf '\n**Runner image:** `ghcr.io/deduva/adp-runner:%s`\n' "$GITHUB_REF_NAME" >> /tmp/notes.md
          printf '**Runner digest:** `%s`\n' "$RUNNER_DIGEST" >> /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
