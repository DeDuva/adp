# #101: release identity. Until this existed the repo had zero tags, zero
# releases, no CHANGELOG, and no published image — a consumer could pin only
# a raw SHA, and since there is deliberately no hosted staging rung
# (docs/environments-plan.md), the pinnable artifact IS the separation
# between active development and what stakeholders depend on.
#
# Trigger is a version tag, pushed by a human after the release PR merges.
# The rule the tag carries: the git tag and the served ADP-API-Version move
# together — vX.Y.Z tags a commit whose server/src/api-version.ts says X.Y.Z
# (asserted below, so a mismatched tag fails loudly instead of publishing a
# lie).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the served contract version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP 'export const API_VERSION = "\K[^"]+' server/src/api-version.ts)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag but api-version.ts serves $version — these move together (#101)"; exit 1
          fi

      # The tag check above compares the pushed tag to api-version.ts and nothing
      # else. Every other surface a consumer reads — the spec, the chart operators
      # deploy, the package manifests, the CHANGELOG this workflow is about to
      # publish as release notes — went unchecked, and drifted. This is the same
      # guard CI runs per-push, re-run here because this is the last point before
      # an image goes public.
      - name: Every version surface agrees
        env:
          ADP_REQUIRE_GH: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/dev/check-release.sh

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/deduva/adp:${{ github.ref_name }}
            ghcr.io/deduva/adp:latest
          build-args: |
            ADP_GIT_SHA=${{ github.sha }}

      # helm/adp/values.yaml has pointed the optional runner deployment at
      # ghcr.io/deduva/adp-runner since M4-12, and nothing has ever built or pushed
      # that image — deploy/Dockerfile.runner existed but no workflow used it. The
      # runner is `enabled: false` by default, which is the only reason it went
      # unnoticed: anyone who turned it on got a reference to nothing.
      - name: Build and push the runner image
        id: push-runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.runner
          push: true
          tags: |
            ghcr.io/deduva/adp-runner:${{ github.ref_name }}
            ghcr.io/deduva/adp-runner:latest

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
          RUNNER_DIGEST: ${{ steps.push-runner.outputs.digest }}
        # Notes assembled in a file, not an inline quoted string — a
        # multi-line --notes argument is exactly the shape that silently
        # breaks the YAML block scalar (it did, on this workflow's first
        # run: the unindented continuation lines ended the block).
        run: |
          awk "/^## ${GITHUB_REF_NAME}/{flag=1;next}/^## v/{flag=0}flag" CHANGELOG.md > /tmp/notes.md
          printf '\n**Image:** `ghcr.io/deduva/adp:%s`\n' "$GITHUB_REF_NAME" >> /tmp/notes.md
          printf '**Digest:** `%s` — pin with `ADP_IMAGE=ghcr.io/deduva/adp@%s`\n' "$DIGEST" "$DIGEST" >> /tmp/notes.md
          printf '\n**Runner image:** `ghcr.io/deduva/adp-runner:%s`\n' "$GITHUB_REF_NAME" >> /tmp/notes.md
          printf '**Runner digest:** `%s`\n' "$RUNNER_DIGEST" >> /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
