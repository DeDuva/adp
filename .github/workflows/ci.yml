name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adp
          POSTGRES_PASSWORD: adp
          POSTGRES_DB: adp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adp -d adp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://adp:adp@localhost:5432/adp
      GIT_ROOT: /tmp/adp-ci-git
      SIGNING_KEY: ci-test-key
      MIRROR_CREDENTIAL_KEY: ci-test-mirror-key
      PUBLIC_URL: https://adp.ci.example.com
      # The e2e tier skips itself when DATABASE_URL is absent, so that a laptop
      # with no Postgres can still run `npm test`. That makes a skip and a pass
      # indistinguishable at the exit code — CI must never accept that, so here
      # a missing DATABASE_URL is a hard failure instead (server/test/require-db.ts).
      ADP_REQUIRE_DB: "1"
      # Same argument one layer out: the dependency-admission suites include a
      # deliberately unmocked tier against the live OSV.dev API, which skips
      # itself where egress is unavailable (an offline laptop, a locked-down
      # build agent, an agent sandbox that 403s un-allowlisted hosts). A GitHub
      # runner has egress, so here an unreachable api.osv.dev is a hard failure
      # rather than a quiet loss of coverage (server/test/require-network.ts).
      ADP_REQUIRE_NETWORK: "1"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate
      - run: npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      # The read-only supervision UI (server/web/) — built here so it's
      # actually served at /ui/* by the conformance run below, matching how
      # main.ts skips it silently if unbuilt (a fresh checkout's `npm run
      # dev` shouldn't require this step).
      - working-directory: server/web
        run: npm ci
      - working-directory: server/web
        run: npm run typecheck
      - working-directory: server/web
        run: npm run build
      # #98: web/ built in CI but never ran a test, which is how api.ts's
      # hand-copied server enum drifted (gates_confident missing) and the
      # org console rendered a requirement as a blank label. The suite is
      # tiny and DB-free; its job is binding those copies to their sources.
      - working-directory: server/web
        run: npm test

      - name: Cache pinned gh release
        uses: actions/cache@v4
        with:
          path: ~/.cache/adp-conformance-gh
          key: gh-conformance-${{ hashFiles('server/conformance/run.sh') }}

      # M1b′ gate: the real, unmodified `gh` binary
      # against this server — gh issue view / pr create / pr view / pr merge.
      - run: bash conformance/run.sh

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # No Postgres needed — the CLI's own tests stand up a fake HTTP server
      # (cli/test/cli.test.ts), not a live ADP instance.
      - run: npm test

  adapters:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adapters/package-lock.json
      - run: npm ci
      # No Postgres, no live scanner binary — the adapters' tests run
      # against fixtures captured from real `osv-scanner` runs (see
      # adapters/test/fixtures/) and a fake local HTTP server standing in
      # for ADP, same pattern as the cli/ job.
      - run: npm test

  recorder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recorder/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # No service container and no docker: the recorder is a pure HTTP client
      # and its tests stand up a real local HTTP server of their own, which is
      # what proves the requests it puts on a socket without needing the thing
      # they are addressed to.
      - run: npm test

  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # ubuntu-latest ships a real Docker daemon — ADP_REQUIRE_DOCKER=1 turns
      # a silently-skipped real-container tier into a hard failure, same
      # reason ADP_REQUIRE_DB=1/ADP_REQUIRE_NETWORK=1 are set in the server
      # job: the isolation flags this package exists to enforce
      # (network-deny, resource caps, wall-clock kill) are only proven by
      # actually running a container, not by asserting on an argument list.
      - run: ADP_REQUIRE_DOCKER=1 npm test

  # #99: the §2.1 definition-of-done walkthrough. This is the only thing
  # asserting the `gh pr checks` gap is closed the way the docs promise, and
  # until now it ran only when a human typed `make check` — a headline exit
  # criterion protected by muscle memory. The script is self-contained
  # (migrates, boots its own server on random ports, pins its own gh); it
  # needs Postgres, egress (D16/D17 hit live scanners), and the cli/adapters
  # workspaces it drives.
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adp
          POSTGRES_PASSWORD: adp
          POSTGRES_DB: adp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adp -d adp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://adp:adp@localhost:5432/adp
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - working-directory: cli
        run: npm ci
      - working-directory: adapters
        run: npm ci
      - name: Cache pinned gh release
        uses: actions/cache@v4
        with:
          path: ~/.cache/adp-conformance-gh
          key: gh-conformance-${{ hashFiles('server/conformance/run.sh') }}
      - run: bash acceptance/run.sh

  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The benchmark's reproducibility contract (bench/README.md), enforced:
      # every published number is derived from a committed run record, so
      # regenerating the report must be a no-op. A diff here means a figure was
      # edited by hand or a run record changed without the report following —
      # either way the published numbers stopped being reproducible.
      #
      # The merge-contention measurement itself is enforced separately, by
      # server/test/e2e-merge-contention.test.ts in the `server` job, which
      # drives bench/lib/merge-contention.mjs directly rather than a copy.
      # The transcript reader's own assertions. `measurement.escapeHatchCalls`
      # is meant to be read at a glance and acted on, and the shell splitting
      # under it is exactly the kind of code that looks obviously right and is
      # not — the first version counted `git log | grep curl` as a curl call.
      - run: npm test
      - run: npm run report
      - run: git diff --exit-code report/

  # The published site ships build outputs — docs/html/support.js and the React
  # bundles beside it — and GitHub Pages deploys them straight from the tree, so a
  # stale artifact is a stale *site*. This job also drives both published pages in
  # a real browser and asserts #163's exit criteria: no horizontal scroll at five
  # widths, tables readable at 375px, a visible focus ring on every interactive
  # element, one stylesheet owning the palette, and nothing off-origin but fonts. Before this job existed the runtime was
  # generated from a `dc-runtime/` that was not in the repository at all: the file
  # could be served but not rebuilt, fixed or upgraded by anyone working here.
  #
  # `npm run check` rebuilds into memory and compares. A diff means someone edited a
  # generated file by hand, or changed dc-runtime/src without committing the result.
  site-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dc-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      # The published pages themselves: #163's exit criteria, in a real browser.
      # No skip path — a missing browser fails the job rather than passing quietly.
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Documents that have quietly stopped being true. AGENTS.md names the file carrying
  # each invariant, so a rename turns guidance into a wrong map without anything
  # failing; PLAN.md makes status claims that the issue tracker can
  # settle. The 2026-08-22 audit found sixteen contradictions of exactly these shapes,
  # three of them critical, none catchable by the path-only check this replaces.
  #
  # ADP_REQUIRE_GH turns the issue-state half from a skip into a failure — the same
  # bargain as ADP_REQUIRE_DB and ADP_REQUIRE_NETWORK, and set here for the same
  # reason: that half is the one that catches stale status, so CI must not pass
  # without it. GITHUB_TOKEN authenticates gh for the issue lookups.
  #
  # Deliberately its own job: it costs seconds and should report independently of
  # whether the suite is red.
  docs:
    runs-on: ubuntu-latest
    env:
      ADP_REQUIRE_GH: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: make check-docs

  # The same bargain one layer over: CHANGELOG.md states that the tag, the release,
  # the image and the served ADP-API-Version move together, and until now the only
  # enforced edge was release.yml's tag-vs-api-version check — which runs on the tag
  # push, i.e. after everything is already published. Both 0.4.0 and 0.5.0 were
  # bumped in-tree and never released; the chart went on telling operators 0.2.0.
  # This runs per-push instead, against every surface.
  #
  # ADP_REQUIRE_GH turns the tag half from a skip into a failure, same as above.
  release-consistency:
    runs-on: ubuntu-latest
    env:
      ADP_REQUIRE_GH: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: make check-release

  # The demo is a published claim — the README and the landing page both point a
  # visitor at it — so it gets a gate like any other published artifact. It runs
  # non-interactively here and asserts the whole narrated path: ephemeral stack,
  # real gh, the 422 refusal before evidence, the land after it, and a readable
  # evidence bundle at the end. Without this the demo rots the first time an
  # endpoint or a response shape moves, and the first person to notice is
  # someone evaluating the project.
  #
  # It brings up its own Postgres through scripts/dev/up.sh rather than a
  # services: block, because that is the path a visitor actually takes.
  demo:
    runs-on: ubuntu-latest
    env:
      ADP_DEMO_NO_WAIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: make demo
      # The demo starts a database, a server and a proxy. If it can leak any of
      # them, so can every laptop that runs it.
      - name: nothing leaked
        if: always()
        run: bash scripts/dev/verify-clean.sh

  # #158 made a persistent local instance a supported mode rather than a test
  # fixture, and a supported mode nobody runs is a supported mode that rots.
  # Its own job rather than part of `make check`: it binds fixed ports and a
  # named docker volume, so it would collide with a developer's own local
  # instance and with a second worktree running the suite. Same bargain the
  # `demo` job strikes.
  local-instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: bash scripts/dev/local-smoke.sh
      # The smoke script destroys its own instance on every exit path. If it
      # can leak a container, a named volume or a daemon, so can every laptop
      # that runs `make local`.
      - name: nothing leaked
        if: always()
        run: |
          bash scripts/dev/local.sh destroy >/dev/null 2>&1 || true
          bash scripts/dev/verify-clean.sh

  # AGENTS.md §Branches names three prefixes and the reason this is a check rather than
  # a note: a web agent session names its branch after the harness before the agent has
  # read the file that would have told it not to. 24 of the last 30 PRs held the
  # convention; the six that did not were mostly defaults nobody chose.
  #
  # pull_request only — a push build on main has no head ref to judge.
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: make check-branch

  # M4-12. The chart is a published artifact — someone else's cluster runs it —
  # so it gets the same treatment as spec/openapi.yaml: something has to fail
  # when it stops being true. Lint plus a render of every combination that
  # changes the output, because a chart is only ever wrong at render time.
  #
  # `make helm` is the same target a developer runs; ADP_REQUIRE_HELM turns its
  # local "helm not installed, skipping" into a hard failure here, the way
  # ADP_REQUIRE_DB and ADP_REQUIRE_NETWORK already do for the suites that can
  # skip themselves.
  helm:
    runs-on: ubuntu-latest
    env:
      ADP_REQUIRE_HELM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: make helm
