name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adp
          POSTGRES_PASSWORD: adp
          POSTGRES_DB: adp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adp -d adp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://adp:adp@localhost:5432/adp
      GIT_ROOT: /tmp/adp-ci-git
      SIGNING_KEY: ci-test-key
      PUBLIC_URL: https://adp.ci.example.com
      # The e2e tier skips itself when DATABASE_URL is absent, so that a laptop
      # with no Postgres can still run `npm test`. That makes a skip and a pass
      # indistinguishable at the exit code — CI must never accept that, so here
      # a missing DATABASE_URL is a hard failure instead (server/test/require-db.ts).
      ADP_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate
      - run: npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/web/package-lock.json

      # The read-only supervision UI (server/web/) — built here so it's
      # actually served at /ui/* by the conformance run below, matching how
      # main.ts skips it silently if unbuilt (a fresh checkout's `npm run
      # dev` shouldn't require this step).
      - working-directory: server/web
        run: npm ci
      - working-directory: server/web
        run: npm run typecheck
      - working-directory: server/web
        run: npm run build

      - name: Cache pinned gh release
        uses: actions/cache@v4
        with:
          path: ~/.cache/adp-conformance-gh
          key: gh-conformance-${{ hashFiles('server/conformance/run.sh') }}

      # M1b′ gate (docs/pragmatic_mvp.md): the real, unmodified `gh` binary
      # against this server — gh issue view / pr create / pr view / pr merge.
      - run: bash conformance/run.sh

  adapters:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adapters/package-lock.json
      - run: npm ci
      # No Postgres, no live scanner binary — the adapters' tests run
      # against fixtures captured from real `osv-scanner` runs (see
      # adapters/test/fixtures/) and a fake local HTTP server standing in
      # for ADP, same pattern as the cli/ job.
      - run: npm test
