name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adp
          POSTGRES_PASSWORD: adp
          POSTGRES_DB: adp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adp -d adp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://adp:adp@localhost:5432/adp
      GIT_ROOT: /tmp/adp-ci-git
      SIGNING_KEY: ci-test-key
      PUBLIC_URL: https://adp.ci.example.com
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate
      - run: npm test
