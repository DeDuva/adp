<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ADP — share card source</title>
<!-- The card is drawn in the site's own design system rather than beside it:
     site.css is linked, so the palette, the type ramp, the spacing scale and
     the 24px blueprint grid all come from the one file that owns them. The
     rules below add layout only, and every value in them is a var() or a
     calc() over one — there is no hex literal and no bare pixel size here.

     Open this file in a browser to see the card. render.mjs sets the three
     text nodes per page and screenshots the .card element at 1200x630. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../docs/html/site.css">
<style>
  body { margin: 0; }

  /* 1200x630 is what every platform crops to; nothing about this element is
     responsive, because it is rendered once at exactly that size. */
  .og { width: 1200px; height: 630px;
        display: flex; flex-direction: column;
        /* `inherit` rather than a restatement: the paper colour and the 24px
           blueprint grid are one declaration in site.css, on body, and the card
           sits at the origin so the grid lines up exactly as the site's does. */
        background: inherit; overflow: hidden; }

  /* The masthead band, the site's one dark surface, in the site's proportions. */
  .og__band { background: var(--rule-strong); color: var(--paper);
              padding: var(--s3) var(--s5);
              font: 500 var(--t4)/1 var(--mono); letter-spacing: .1em;
              display: flex; justify-content: space-between; align-items: center; }
  .og__band em { color: var(--on-dark-dim); font-style: normal; }

  /* The mark is a flex sibling rather than an absolutely-positioned overlay,
     so a long title cannot run underneath it. Collision is ruled out by the
     layout instead of by a max-width someone has to keep true. */
  .og__body { flex: 1; display: flex; align-items: center;
              gap: var(--s5); padding: 0 var(--s5); }
  .og__text { flex: 1; min-width: 0;
              display: flex; flex-direction: column; gap: var(--s4); }

  .og__eyebrow { margin: 0; color: var(--dim);
                 font: 500 var(--t5)/1 var(--mono); letter-spacing: .16em;
                 text-transform: uppercase; }

  /* The ramp still owns the sizes: a share card is read at about a third of
     its rendered width, so each step is the ramp's own value scaled once. */
  .og__title { margin: 0; color: var(--ink);
               font: 700 calc(var(--t7) * 1.3)/1.05 var(--sans);
               letter-spacing: -.02em; }

  .og__sub { margin: 0; color: var(--sub);
             font: 400 calc(var(--t5) * 1.25)/1.35 var(--sans); max-width: 40ch; }

  .og__foot { border-top: 1px solid var(--rule-strong);
              margin: 0 var(--s5); padding: var(--s3) 0 var(--s5);
              display: flex; justify-content: space-between; align-items: baseline;
              color: var(--sub); font: 400 var(--t5)/1 var(--mono); }
  .og__foot strong { color: var(--accent); font-weight: 500; }

  /* The seal from the favicon, at the size the card can carry it. */
  .og__mark { flex: none; align-self: flex-start; margin-top: var(--s6);
              width: calc(var(--s8) + var(--s3)); height: calc(var(--s8) + var(--s3)); }
</style>
</head>
<body>
<div class="og">
  <div class="og__band"><span>ADP · THE AGENT-NATIVE FORGE</span><em>SELF-HOSTED · MIT</em></div>
  <div class="og__body">
    <div class="og__text">
      <p class="og__eyebrow" id="eyebrow">Overview</p>
      <h1 class="og__title" id="title">Agents write the code. Someone still has to answer for it.</h1>
      <p class="og__sub" id="sub">A self-hosted, GitHub-compatible forge that binds every change to its
      intent, provenance, approvals and signed evidence.</p>
    </div>
    <svg class="og__mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" fill="var(--rule-strong)"/>
      <rect x="14.5" y="14.5" width="35" height="35" fill="none" stroke="var(--paper)" stroke-width="5"/>
      <rect x="32" y="32" width="17.5" height="17.5" fill="var(--accent)"/>
    </svg>
  </div>
  <div class="og__foot"><span id="foot">deduva.github.io/adp</span><strong>git · gh · your CI, unchanged</strong></div>
</div>
</body>
</html>
