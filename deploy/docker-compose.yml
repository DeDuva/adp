services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GIT_ROOT: ${GIT_ROOT}
      SIGNING_KEY: ${SIGNING_KEY}
      # Required by server/src/config.ts with no default — the AES-256-GCM key
      # for mirror credentials and both webhook-signing secrets
      # (core/mirror-crypto.ts). Without it the server exits 1 at boot.
      MIRROR_CREDENTIAL_KEY: ${MIRROR_CREDENTIAL_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      PORT: ${PORT}
      GIT_MAX_PACK_BYTES: ${GIT_MAX_PACK_BYTES}
      LAND_POLICY_FLOOR: ${LAND_POLICY_FLOOR}
      # Deploy-time build stamp, served by GET /version. Optional by design —
      # `:-` so a hand-written .env without them does not make compose warn,
      # and the server falls back to the checkout it was built from.
      ADP_GIT_SHA: ${ADP_GIT_SHA:-}
      ADP_GIT_REF: ${ADP_GIT_REF:-}
      ADP_DEPLOYED_AT: ${ADP_DEPLOYED_AT:-}
    volumes:
      - git_data:/data/git
    command: sh -c "node dist/db/migrate.js && node dist/main.js"
    # Caddy reaches this over the compose network by name, so the published
    # port exists for one reason: M4-11's Ops Agent scrapes /metrics from the
    # host (infra/dev/startup.sh) and a container-network-only service is not
    # reachable from there. Bound to 127.0.0.1 explicitly — an unqualified
    # "3000:3000" would publish the unauthenticated /metrics endpoint, and
    # every other route, on the VM's public interface, bypassing Caddy and its
    # TLS entirely.
    #
    # `:-3000` for the same reason the build stamps above use it: a hand-written
    # .env that omits PORT must not turn a missing variable into an unparseable
    # port mapping. 3000 is also what server/src/config.ts defaults to, so the
    # published port and the listening port stay in agreement either way.
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    # Caddy expands {$PUBLIC_URL} in the Caddyfile from its OWN process
    # environment. Compose's .env file only interpolates into this YAML, it
    # does not inject anything into containers — so without this block the
    # site address is empty and Caddy serves nothing.
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  git_data:
  caddy_data:
  caddy_config:
