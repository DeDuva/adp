{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "adp.serviceAccountName" . }}
  labels:
    {{- include "adp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# ADP talks to Postgres and to git on disk. It has no reason to talk to the
# Kubernetes API, so it gets no token for one.
automountServiceAccountToken: false
{{- end }}
