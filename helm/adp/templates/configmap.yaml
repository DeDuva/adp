apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adp.fullname" . }}
  labels:
    {{- include "adp.labels" . | nindent 4 }}
data:
  PORT: "3000"
  GIT_ROOT: /data/git
  # Signed into evidence and handed back in clone URLs, so this is part of the
  # record rather than a display string — see values.yaml.
  PUBLIC_URL: {{ include "adp.publicUrl" . | quote }}
  LAND_POLICY_FLOOR: {{ .Values.server.landPolicyFloor | quote }}
  GIT_MAX_PACK_BYTES: {{ .Values.server.gitMaxPackBytes | quote }}
  # #161. Always emitted, unlike the OIDC block below: an operator has to be
  # able to read what this instance's retention window is from the rendered
  # config, and an absent key that means "90" is a promise nobody can see.
  TRAJECTORY_RETENTION_DAYS: {{ .Values.server.trajectoryRetentionDays | quote }}
{{- if .Values.oidc.clientId }}
  {{/*
    M4-5. Emitted only when a client id is set, because the server mounts the
    /auth/oidc routes on the presence of credentials — a half-configured OIDC
    block would produce routes that cannot complete a flow.
  */}}
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  OIDC_DISCOVERY_URL: {{ .Values.oidc.discoveryUrl | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_ALLOWED_DOMAINS: {{ .Values.oidc.allowedDomains | quote }}
  OIDC_TOKEN_TTL_MINUTES: {{ .Values.oidc.tokenTtlMinutes | quote }}
{{- end }}
