{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adp.fullname" . }}
  labels:
    {{- include "adp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{/*
    `required` rather than a generated default. A chart that invents these on
    install regenerates them on the next upgrade unless it looks the old ones
    up first — and a rotated SIGNING_KEY orphans every signature the instance
    has ever produced, which is the one failure this project cannot walk back.
    infra/bootstrap.sh states the same rule for the same reason.
  */}}
  SIGNING_KEY: {{ required "secrets.signingKey is required: `openssl rand -hex 32`. The chart will not generate one — a key regenerated on upgrade orphans every signature this instance has produced." .Values.secrets.signingKey | quote }}
  MIRROR_CREDENTIAL_KEY: {{ required "secrets.mirrorCredentialKey is required: `openssl rand -hex 32`. It encrypts mirror credentials and webhook secrets at rest." .Values.secrets.mirrorCredentialKey | quote }}
  DATABASE_URL: {{ include "adp.databaseUrl" . | quote }}
{{- if .Values.oidc.clientId }}
  {{/*
    Same refusal shape as the keys above: naming a client id without its
    secret would render routes that 502 on every login. Better to fail at
    install, where the message can say what is missing.
  */}}
  OIDC_CLIENT_SECRET: {{ required "oidc.clientSecret is required when oidc.clientId is set — the login routes cannot complete a token exchange without it." .Values.oidc.clientSecret | quote }}
{{- end }}
{{- end }}
